e }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"border-top:1px solid #1A2740;padding-top:12px;display:flex;align-items:center;gap:10px\">\n        <div style=\"width:32px;height:32px;border-radius:50%;background:#1E2C44;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600\">{{ userInitials }}<\u002Fdiv>\n        <div style=\"flex:1;min-width:0\">\n          <div style=\"font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ userName }}<\u002Fdiv>\n          <div style=\"font-size:11px;color:#8296B4;font-weight:600\">{{ roleLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:10px;background:#0B1220;border:1px solid #1A2740;border-radius:8px;padding:9px 10px\">\n        <div style=\"display:flex;align-items:center;gap:7px\">\n          <div style=\"width:7px;height:7px;border-radius:50%;background:#35C2A5;flex:none\"><\u002Fdiv>\n          <div style=\"font-size:11.5px;color:#8296B4;line-height:1.3\">Saved on this device<\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ clearDemo }}\" style=\"cursor:pointer;width:100%;margin-top:8px;background:transparent;border:1px solid #22334F;border-radius:7px;color:#5C6E8A;padding:7px;font-size:11.5px\" style-hover=\"border-color:#F2A33C;color:#F2A33C\">{{ clearDemoLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ logout }}\" style=\"cursor:pointer;margin-top:8px;background:transparent;border:1px solid #22334F;border-radius:8px;color:#8296B4;padding:8px;font-size:13px\" style-hover=\"border-color:#E5544B;color:#E5544B\">Sign out<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-width:0\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:22px 26px 0;flex-wrap:wrap\">\n        <div>\n          <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:27px;letter-spacing:.04em;line-height:1.1\">{{ deskTitle }}<\u002Fdiv>\n          <div style=\"color:#8296B4;font-size:13px;margin-top:3px\">{{ deskSub }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#5C6E8A\">August 2026 · Ahmadi Depot<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:20px 26px 40px\">\n\n        <sc-if value=\"{{ showDaily }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px\">\n            <sc-for list=\"{{ dailySummary }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"flex:1;min-width:180px;background:#111B2C;border:1px solid {{ s.bd }};border-radius:11px;padding:14px 16px\">\n                <div style=\"color:#8296B4;font-size:12px;font-weight:600\">{{ s.label }}<\u002Fdiv>\n                <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:34px;color:{{ s.tint }};line-height:1.1\">{{ s.value }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"flex:2;min-width:240px;background:#0E1729;border:1px solid #1E2C44;border-radius:11px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center\">\n              <div style=\"font-family:'JetBrains Mono';font-size:12px;color:#F2A33C;letter-spacing:.08em\">{{ dailyDate }}<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:13px\">{{ dailyMarked }} · tap a status to change it<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;overflow:hidden\">\n            <div style=\"overflow-x:auto\">\n              <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13.5px;min-width:900px\">\n                <sc-raw-thead><sc-raw-tr>\n                  <sc-for list=\"{{ dailyCols }}\" as=\"c\" hint-placeholder-count=\"6\">\n                    <sc-raw-th style=\"text-align:{{ c.align }};padding:9px 12px;border-bottom:1px solid #1E2C44;color:#8296B4;font-size:12px;font-weight:600;background:#0E1729\">{{ c.label }}<\u002Fsc-raw-th>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ dailyRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n                    <sc-raw-tr>\n                      <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #162236;font-family:'JetBrains Mono';font-weight:700\">{{ r.no }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #162236;font-family:'JetBrains Mono';color:#8296B4\">{{ r.plate }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono'\">{{ r.cap }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #162236\">{{ r.driver }}<div style=\"color:#5C6E8A;font-size:11.5px\">{{ r.category }}<\u002Fdiv><\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #162236\">\n                        <div style=\"display:flex;gap:6px\">\n                          <sc-for list=\"{{ r.toggles }}\" as=\"t\" hint-placeholder-count=\"2\">\n                            <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"cursor:pointer;border-radius:7px;padding:6px 11px;font-size:12.5px;background:{{ t.bg }};border:1px solid {{ t.bd }};color:{{ t.fg }};white-space:nowrap\">{{ t.label }}<\u002Fbutton>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #162236\">\n                        <input value=\"{{ r.remarks }}\" sc-camel-on-change=\"{{ r.onRemarks }}\" placeholder=\"{{ r.remarksPh }}\" style=\"width:100%;min-width:200px;background:#0B1220;border:1px solid #22334F;border-radius:8px;color:#E6EDF7;padding:8px 10px;font-size:13px\">\n                      <\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showDrivers }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:minmax(320px,1fr) minmax(340px,1.3fr);gap:14px\">\n            <div style=\"display:flex;flex-direction:column;gap:14px\">\n              <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n                <div style=\"font-weight:600;font-size:15px\">Add a driver<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:12px;margin-top:5px\">Name and Employee ID are needed. Add the Civil ID too, so Accounts and Safety can search by either number.<\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px\">\n                  <div style=\"grid-column:1 / -1\">\n                    <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin-bottom:5px\">Full name<\u002Fdiv>\n                    <input value=\"{{ newDrvName }}\" sc-camel-on-change=\"{{ onNewDrvName }}\" placeholder=\"e.g. Rakesh Kumar\" style=\"width:100%;min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 12px;font-size:14.5px\">\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin-bottom:5px\">Employee ID<\u002Fdiv>\n                    <input value=\"{{ newDrvEmp }}\" sc-camel-on-change=\"{{ onNewDrvEmp }}\" placeholder=\"30188\" style=\"width:100%;min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 12px;font-size:14.5px;font-family:'JetBrains Mono'\">\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin-bottom:5px\">Civil ID<\u002Fdiv>\n                    <input value=\"{{ newDrvCivil }}\" sc-camel-on-change=\"{{ onNewDrvCivil }}\" placeholder=\"284091100123\" style=\"width:100%;min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 12px;font-size:14.5px;font-family:'JetBrains Mono'\">\n                  <\u002Fdiv>\n                  <div style=\"grid-column:1 / -1\">\n                    <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin-bottom:5px\">Mobile<\u002Fdiv>\n                    <input value=\"{{ newDrvMobile }}\" sc-camel-on-change=\"{{ onNewDrvMobile }}\" placeholder=\"+965 …\" style=\"width:100%;min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 12px;font-size:14.5px\">\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ addDriver }}\" style=\"cursor:pointer;width:100%;min-height:46px;margin-top:13px;border-radius:9px;border:0;background:#F2A33C;color:#0B1220;font-size:15px;font-weight:700\">Add driver<\u002Fbutton>\n              <\u002Fdiv>\n\n              <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n                <div style=\"font-weight:600;font-size:15px\">Add many at once<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:12px;margin-top:5px;line-height:1.45\">One driver per line, commas in between:<br><br><span style=\"font-family:'JetBrains Mono';font-size:12px;color:#C7D6EA\">Name, Employee ID, Civil ID, Mobile<\u002Fspan><\u002Fdiv>\n                <textarea value=\"{{ bulkText }}\" sc-camel-on-change=\"{{ onBulkText }}\" rows=\"7\" placeholder=\"Rakesh Kumar, 30188, 284091100123, +965 55512345\nSunil Hassan, 30191, 285091100987, +965 66698765\" style=\"width:100%;margin-top:11px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:11px 12px;font-size:13.5px;font-family:'JetBrains Mono';line-height:1.6;resize:vertical\"><\u002Ftextarea>\n                <button sc-camel-on-click=\"{{ importBulk }}\" style=\"cursor:pointer;width:100%;min-height:46px;margin-top:11px;border-radius:9px;border:1px solid #22334F;background:transparent;color:#C7D6EA;font-size:14.5px;font-weight:600\">{{ bulkLabel }}<\u002Fbutton>\n                <div style=\"color:#5C6E8A;font-size:12px;margin-top:7px\">You can copy the four columns straight out of Excel and paste them here.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n                <div style=\"font-weight:600;font-size:15px\">Driver list<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono';font-size:12px;color:#8296B4\">{{ driverCount }} · {{ driverPresentCount }} on duty today<\u002Fdiv>\n              <\u002Fdiv>\n              <input value=\"{{ drvSearch }}\" sc-camel-on-change=\"{{ onDrvSearch }}\" placeholder=\"Search name or ID…\" style=\"width:100%;min-height:42px;margin-top:11px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 12px;font-size:14px\">\n              <sc-if value=\"{{ driverMasterEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"margin-top:14px;border:1px dashed #22334F;border-radius:10px;padding:28px;text-align:center;color:#8296B4;font-size:13.5px\">No drivers yet. Add them with the form, or paste your list on the left.<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:11px;max-height:620px;overflow-y:auto\">\n                <sc-for list=\"{{ driverMaster }}\" as=\"d\" hint-placeholder-count=\"0\">\n                  <div style=\"display:flex;align-items:center;gap:11px;background:#0E1729;border:1px solid #1E2C44;border-radius:10px;padding:10px 12px\">\n                    <span style=\"font-size:11.5px;color:#5C6E8A;flex:none;width:26px\">{{ d.index }}<\u002Fspan>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:14px\">{{ d.name }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#8296B4\">{{ d.ids }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:{{ d.tint }}\">{{ d.assign }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ d.onRemove }}\" style=\"cursor:pointer;flex:none;min-height:36px;padding:0 11px;border-radius:8px;border:1px solid #22334F;background:transparent;color:#5C6E8A;font-size:12px;white-space:nowrap\" style-hover=\"border-color:#E5544B;color:#E5544B\">{{ d.removeLabel }}<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showAttend }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#111B2C;border:1px solid #3E2A57;border-radius:11px;padding:16px 18px;margin-bottom:14px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n              <div>\n                <div style=\"font-weight:600;font-size:15px\">Not at KNPC today<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:12px\">Sent to another project or away on vacation, as marked by the foreman<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:'JetBrains Mono';font-size:12px;color:#C08BF0\">{{ awayCount }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ awayEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:12px;border:1px dashed #22334F;border-radius:10px;padding:20px;text-align:center;color:#8296B4;font-size:13px\">Everyone is accounted for at Ahmadi today.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:12px\">\n              <sc-for list=\"{{ awayRows }}\" as=\"w\" hint-placeholder-count=\"0\">\n                <div style=\"min-width:250px;flex:1;background:#0E1729;border:1px solid {{ w.bd }};border-radius:10px;padding:11px 13px;display:flex;gap:11px;align-items:center\">\n                  <div style=\"width:5px;align-self:stretch;min-height:36px;border-radius:4px;background:{{ w.tint }};flex:none\"><\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font-size:14px\">{{ w.name }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:{{ w.tint }}\">{{ w.status }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:#8296B4\">{{ w.detail }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n            <div style=\"font-weight:600;font-size:15px\">Duty hours &amp; attendance<\u002Fdiv>\n            <div style=\"color:#8296B4;font-size:12px\">The foreman marks each driver every morning. If nobody marks a driver, his duty log decides it. An open vacation record always wins.<\u002Fdiv>\n            <sc-if value=\"{{ attendEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:14px;border:1px dashed #22334F;border-radius:10px;padding:28px;text-align:center;color:#8296B4;font-size:13.5px\">Drivers appear here once they save their own profile.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"overflow-x:auto\">\n              <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px;min-width:860px\">\n                <sc-raw-thead><sc-raw-tr>\n                  <sc-for list=\"{{ attendCols }}\" as=\"c\" hint-placeholder-count=\"7\">\n                    <sc-raw-th style=\"text-align:{{ c.align }};padding:8px 10px;border-bottom:1px solid #1E2C44;color:#8296B4;font-size:12px;font-weight:600\">{{ c.label }}<\u002Fsc-raw-th>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ attendRows }}\" as=\"a\" hint-placeholder-count=\"0\">\n                    <sc-raw-tr>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236\">{{ a.driver }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;color:{{ a.stTint }}\">{{ a.status }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;color:#8296B4;font-size:12.5px\">{{ a.project }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;font-family:'JetBrains Mono';color:#8296B4\">{{ a.assign }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono'\">{{ a.days }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono'\">{{ a.hours }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono';color:#F2A33C\">{{ a.ot }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono';color:#8296B4\">{{ a.off }}<\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showFuel }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px\">\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n                <div>\n                  <div style=\"color:#E6EDF7;font-weight:600;font-size:15px\">Per-tanker monthly trend<\u002Fdiv>\n                  <div style=\"color:#8296B4;font-size:12px\">Daily mileage km/L · August 2026<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-raw-select value=\"{{ fuelSelected }}\" sc-camel-on-change=\"{{ onFuelTanker }}\" style=\"min-height:40px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 12px;font-size:14px\">\n                  <sc-for list=\"{{ fuelTankerOptions }}\" as=\"o\" hint-placeholder-count=\"8\">\n                    <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:12px;margin:14px 0\">\n                <div style=\"flex:1;background:#0E1729;border:1px solid #1E2C44;border-radius:10px;padding:11px 13px\">\n                  <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:25px\">{{ fuelPick.km }}<\u002Fdiv>\n                  <div style=\"color:#8296B4;font-size:11px;letter-spacing:-.005em\">Total KM<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:1;background:#0E1729;border:1px solid #1E2C44;border-radius:10px;padding:11px 13px\">\n                  <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:25px\">{{ fuelPick.litres }}<\u002Fdiv>\n                  <div style=\"color:#8296B4;font-size:11px;letter-spacing:-.005em\">Fuel consumed<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:1;background:#0E1729;border:1px solid #1E2C44;border-radius:10px;padding:11px 13px\">\n                  <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:25px;color:{{ fuelPick.tint }}\">{{ fuelPick.avg }}<\u002Fdiv>\n                  <div style=\"color:#8296B4;font-size:11px;letter-spacing:-.005em\">Avg mileage<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <svg sc-camel-view-box=\"0 0 600 190\" style=\"width:100%;height:180px\">\n                <sc-for list=\"{{ gridLines }}\" as=\"g\" hint-placeholder-count=\"4\">\n                  <line x1=\"10\" x2=\"590\" y1=\"{{ g.y }}\" y2=\"{{ g.y }}\" stroke=\"#1E2C44\" stroke-width=\"1\"><\u002Fline>\n                <\u002Fsc-for>\n                <polygon points=\"{{ fuelArea }}\" fill=\"rgba(53,194,165,0.14)\"><\u002Fpolygon>\n                <polyline points=\"{{ fuelLine }}\" fill=\"none\" stroke=\"#35C2A5\" stroke-width=\"2.5\" stroke-linejoin=\"round\"><\u002Fpolyline>\n                <sc-for list=\"{{ fuelDots }}\" as=\"d\" hint-placeholder-count=\"30\">\n                  <circle cx=\"{{ d.x }}\" cy=\"{{ d.y }}\" r=\"2.5\" fill=\"#0B1220\" stroke=\"#35C2A5\" stroke-width=\"1.5\"><\u002Fcircle>\n                <\u002Fsc-for>\n              <\u002Fsvg>\n              <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#5C6E8A\">\n                <sc-for list=\"{{ fuelAxis }}\" as=\"a\" hint-placeholder-count=\"5\"><span>{{ a.l }}<\u002Fspan><\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:10px;font-size:13px;color:{{ fuelPick.tint }}\">{{ fuelPick.band }} · fleet avg {{ fuelFleetAvg }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n              <div style=\"color:#E6EDF7;font-weight:600;font-size:15px\">Mileage ranking<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12px;margin-bottom:12px\">Best to worst · fleet avg {{ fuelFleetAvg }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto\">\n                <sc-for list=\"{{ fuelRows }}\" as=\"r\" hint-placeholder-count=\"10\">\n                  <div>\n                    <div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px\">\n                      <span style=\"font-family:'JetBrains Mono'\">{{ r.no }}<\u002Fspan>\n                      <span style=\"font-family:'JetBrains Mono';color:{{ r.tint }}\">{{ r.avg }} km/L<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"height:7px;border-radius:4px;background:#0B1220\"><div style=\"height:100%;border-radius:4px;background:{{ r.tint }};width:{{ r.w }}\"><\u002Fdiv><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n            <div style=\"font-weight:600;font-size:15px\">Tanker monthly fuel &amp; mileage summary<\u002Fdiv>\n            <div style=\"color:#8296B4;font-size:12px\">Avg = total KM ÷ total fuel consumed · consumption from opening %, refuels and closing % · click a row for its trend<\u002Fdiv>\n            <div style=\"overflow-x:auto\">\n              <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px;min-width:820px\">\n                <sc-raw-thead><sc-raw-tr>\n                  <sc-for list=\"{{ fuelCols }}\" as=\"c\" hint-placeholder-count=\"7\">\n                    <sc-raw-th style=\"text-align:{{ c.align }};padding:8px 10px;border-bottom:1px solid #1E2C44;color:#8296B4;font-size:12px;font-weight:600\">{{ c.label }}<\u002Fsc-raw-th>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ fuelRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n                    <sc-raw-tr sc-camel-on-click=\"{{ r.onPick }}\" style=\"cursor:pointer\">\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;font-family:'JetBrains Mono';font-weight:700\">{{ r.no }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;font-family:'JetBrains Mono';color:#8296B4\">{{ r.plate }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236\">{{ r.driver }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono'\">{{ r.km }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono'\">{{ r.litres }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono';color:{{ r.tint }}\">{{ r.avg }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono';color:{{ r.tint }}\">{{ r.delta }}<\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showRoster }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#111B2C;border:1px solid #3E2A57;border-radius:11px;padding:16px 18px;margin-bottom:14px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n              <div>\n                <div style=\"font-weight:600;font-size:15px\">Off the KNPC roster today<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:12px\">Why a driver is missing from this list<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:'JetBrains Mono';font-size:12px;color:#C08BF0\">{{ awayCount }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ awayEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:12px;border:1px dashed #22334F;border-radius:10px;padding:18px;text-align:center;color:#8296B4;font-size:13px\">No transfers or vacations recorded for today.<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:12px\">\n              <sc-for list=\"{{ awayRows }}\" as=\"w\" hint-placeholder-count=\"0\">\n                <div style=\"min-width:250px;flex:1;background:#0E1729;border:1px solid {{ w.bd }};border-radius:10px;padding:11px 13px;display:flex;gap:11px;align-items:center\">\n                  <div style=\"width:5px;align-self:stretch;min-height:36px;border-radius:4px;background:{{ w.tint }};flex:none\"><\u002Fdiv>\n                  <div style=\"flex:1;min-width:0\">\n                    <div style=\"font-size:14px\">{{ w.name }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:{{ w.tint }}\">{{ w.status }}<\u002Fdiv>\n                    <div style=\"font-size:12px;color:#8296B4\">{{ w.detail }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px\">\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n              <div style=\"font-weight:600;font-size:15px\">Morning assignment · {{ morningDate }}<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12px\">{{ rosterForemen }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:{{ assignSavedTint }};margin-bottom:8px\">{{ assignSavedNote }}<\u002Fdiv>\n              <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n                <sc-raw-thead><sc-raw-tr>\n                  <sc-raw-th style=\"text-align:left;padding:8px 10px;border-bottom:1px solid #1E2C44;color:#8296B4;font-size:12px;font-weight:600\">Tanker<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"text-align:left;padding:8px 10px;border-bottom:1px solid #1E2C44;color:#8296B4;font-size:12px;font-weight:600\">Day driver<\u002Fsc-raw-th>\n                  <sc-raw-th style=\"text-align:left;padding:8px 10px;border-bottom:1px solid #1E2C44;color:#8296B4;font-size:12px;font-weight:600\">Night driver<\u002Fsc-raw-th>\n                <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ rosterRows }}\" as=\"r\" hint-placeholder-count=\"10\">\n                    <sc-raw-tr>\n                      <sc-raw-td style=\"padding:8px 10px;border-bottom:1px solid #162236;font-family:'JetBrains Mono';font-weight:700\">{{ r.tanker }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:8px 10px;border-bottom:1px solid #162236;color:{{ r.tint }}\">{{ r.day }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:8px 10px;border-bottom:1px solid #162236;color:{{ r.tint }}\">{{ r.night }}<\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n              <div style=\"font-weight:600;font-size:15px\">Tanker usage &amp; replacements<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12px;margin-bottom:12px\">Start / end timestamps for every swap<\u002Fdiv>\n              <div style=\"display:flex;gap:10px;margin-bottom:12px\">\n                <sc-for list=\"{{ usageSummary }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <div style=\"flex:1;background:#0E1729;border:1px solid #1E2C44;border-radius:10px;padding:11px 12px\">\n                    <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:24px;color:{{ s.tint }};line-height:1.1\">{{ s.value }}<\u002Fdiv>\n                    <div style=\"color:#8296B4;font-size:11px;letter-spacing:-.005em\">{{ s.label }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px\">\n                <sc-for list=\"{{ usageRows }}\" as=\"u\" hint-placeholder-count=\"5\">\n                  <div style=\"border:1px solid {{ u.bd }};background:#0E1729;border-radius:10px;padding:11px 13px;display:flex;gap:12px;align-items:center\">\n                    <div style=\"width:5px;align-self:stretch;min-height:34px;border-radius:4px;background:{{ u.tint }};flex:none\"><\u002Fdiv>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:13.5px\"><span style=\"font-family:'JetBrains Mono'\">{{ u.tanker }}<\u002Fspan> · {{ u.driver }}<\u002Fdiv>\n                      <div style=\"color:#8296B4;font-size:12px\">{{ u.replaced }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"text-align:right;font-family:'JetBrains Mono';font-size:12px\">\n                      <div>{{ u.start }} → {{ u.end }}<\u002Fdiv>\n                      <div style=\"color:{{ u.tint }}\">{{ u.shift }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showSendDesk }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px;max-width:620px\">\n            <div style=\"font-weight:600;font-size:15px\">Send your records to the admin<\u002Fdiv>\n            <div style=\"color:#8296B4;font-size:12.5px;margin-top:5px;line-height:1.5\">{{ sendWho }}. Only what you enter yourself goes across, listed below. If you are not sure whether it went, send it again; it will not be counted twice.<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:9px;margin-top:13px\">\n              <sc-for list=\"{{ sendCounts }}\" as=\"c\" hint-placeholder-count=\"0\">\n                <div style=\"flex:1;min-width:150px;background:#0E1729;border:1px solid #1E2C44;border-radius:10px;padding:11px 13px\">\n                  <div style=\"color:#8296B4;font-size:12px;font-weight:600\">{{ c.label }}<\u002Fdiv>\n                  <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:24px;color:#F2A33C;line-height:1.1\">{{ c.value }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:9px;flex-wrap:wrap;margin-top:14px\">\n              <button sc-camel-on-click=\"{{ doDownload }}\" style=\"cursor:pointer;flex:1;min-width:180px;min-height:46px;border-radius:9px;border:0;background:#F2A33C;color:#0B1220;font-size:15px;font-weight:700\">Save report file<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ doCopy }}\" style=\"cursor:pointer;flex:1;min-width:150px;min-height:46px;border-radius:9px;border:1px solid #22334F;background:transparent;color:#C7D6EA;font-size:14.5px;font-weight:600\">Copy code<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"color:#5C6E8A;font-size:12px;margin-top:8px\">Email or message the saved file to the admin, who imports it under Team Reports.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showSecurity }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:14px;max-width:860px\">\n            <div style=\"background:#111B2C;border:1px solid #1F5347;border-radius:11px;padding:16px 18px\">\n              <div style=\"font-weight:600;font-size:15px;color:#7BE3C6\">Protected in this app<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:12px\">\n                <sc-for list=\"{{ secLive }}\" as=\"x\" hint-placeholder-count=\"6\">\n                  <div style=\"background:#0E1729;border:1px solid #1E2C44;border-radius:10px;padding:12px 13px\">\n                    <div style=\"font-size:14.5px\">{{ x.t }}<\u002Fdiv>\n                    <div style=\"color:#8296B4;font-size:13px;margin-top:4px;line-height:1.5;text-wrap:pretty\">{{ x.d }}<\u002Fdiv>\n                    <div style=\"color:#5C6E8A;font-size:12px;margin-top:6px\">{{ x.k }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#111B2C;border:1px solid #4A3517;border-radius:11px;padding:16px 18px\">\n              <div style=\"font-weight:600;font-size:15px;color:#F2A33C\">Waiting on you<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12.5px;margin-top:4px\">One job the app cannot do for itself.<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:12px\">\n                <sc-for list=\"{{ secPending }}\" as=\"x\" hint-placeholder-count=\"1\">\n                  <div style=\"background:#0E1729;border:1px solid #4A3517;border-radius:10px;padding:12px 13px\">\n                    <div style=\"font-size:14.5px\">{{ x.t }}<\u002Fdiv>\n                    <div style=\"color:#8296B4;font-size:13px;margin-top:4px;line-height:1.5;text-wrap:pretty\">{{ x.d }}<\u002Fdiv>\n                    <div style=\"font-family:'JetBrains Mono';font-size:12px;color:#C7D6EA;margin-top:8px;line-height:1.7;word-break:break-word\">{{ x.v }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#111B2C;border:1px solid #4A2320;border-radius:11px;padding:16px 18px\">\n              <div style=\"font-weight:600;font-size:15px;color:#FF9A92\">Still open — needs a server<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12.5px;margin-top:4px\">These are real limits of a browser-only app. Read them before putting live pay data in.<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;margin-top:12px\">\n                <sc-for list=\"{{ secGaps }}\" as=\"x\" hint-placeholder-count=\"5\">\n                  <div style=\"background:#0E1729;border:1px solid #4A2320;border-radius:10px;padding:12px 13px\">\n                    <div style=\"font-size:14.5px\">{{ x.t }}<\u002Fdiv>\n                    <div style=\"color:#8296B4;font-size:13px;margin-top:4px;line-height:1.5;text-wrap:pretty\">{{ x.d }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"margin-top:12px;color:#C7D6EA;font-size:13px;line-height:1.55;text-wrap:pretty\">{{ secNext }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n              <div style=\"font-weight:600;font-size:15px\">Not applicable here<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12.5px;margin-top:4px\">A standard web application test covers these. This app has no server, so there is nothing for them to attack.<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:12px\">\n                <sc-for list=\"{{ secNa }}\" as=\"x\" hint-placeholder-count=\"6\">\n                  <div style=\"background:#0E1729;border:1px solid #1E2C44;border-radius:10px;padding:11px 13px\">\n                    <div style=\"font-size:14px;color:#C7D6EA\">{{ x.t }}<\u002Fdiv>\n                    <div style=\"color:#8296B4;font-size:12.5px;margin-top:3px;line-height:1.5;text-wrap:pretty\">{{ x.d }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showTeamReports }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px\">\n            <sc-for list=\"{{ teamTotals }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:14px 16px\">\n                <div style=\"color:#8296B4;font-size:12px;font-weight:600\">{{ t.label }}<\u002Fdiv>\n                <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:31px;color:{{ t.tint }};line-height:1.15;margin-top:4px\">{{ t.value }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px;max-width:760px\">\n            <div style=\"font-weight:600;font-size:15px\">Import a report<\u002Fdiv>\n            <div style=\"color:#8296B4;font-size:12.5px;margin-top:5px;line-height:1.5\">Everyone taps <strong style=\"color:#C7D6EA\">Send<\u002Fstrong> on their own phone or computer. Drop the file they sent you here, or paste the code. The same report can be imported twice without doubling anything.<\u002Fdiv>\n\n            <div style=\"margin-top:14px\">\n              <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin-bottom:6px\">Report file<\u002Fdiv>\n              <input type=\"file\" accept=\".json,application/json\" sc-camel-on-change=\"{{ onImportFile }}\" style=\"width:100%;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#C7D6EA;padding:11px 12px;font-size:13.5px\">\n            <\u002Fdiv>\n\n            <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin:14px 0 6px\">Or paste the code<\u002Fdiv>\n            <textarea value=\"{{ importText }}\" sc-camel-on-change=\"{{ onImportText }}\" rows=\"5\" placeholder=\"Paste the code from the message here…\" style=\"width:100%;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:11px 12px;font-size:13px;font-family:'JetBrains Mono';line-height:1.55;resize:vertical\"><\u002Ftextarea>\n            <button sc-camel-on-click=\"{{ doImportText }}\" style=\"cursor:pointer;width:100%;min-height:46px;margin-top:11px;border-radius:9px;border:0;background:#F2A33C;color:#0B1220;font-size:15px;font-weight:700\">Import into dashboard<\u002Fbutton>\n\n            <sc-if value=\"{{ hasLastImport }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:13px;background:#0F241F;border:1px solid #1F5347;border-radius:10px;padding:11px 13px\">\n                <div style=\"color:#8296B4;font-size:12px;font-weight:600\">Last import<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#7BE3C6;margin-top:3px\">{{ lastImport }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showLookup }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px;margin-bottom:14px\">\n            <div style=\"font-weight:600;font-size:15px\">Driver lookup — full history<\u002Fdiv>\n            <div style=\"color:#8296B4;font-size:12px;margin-bottom:12px\">Enter an Employee ID or Civil ID. Nothing is cleared at month end, so old years are still here.<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end\">\n              <div style=\"flex:1;min-width:260px\">\n                <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin-bottom:5px\">Employee ID / Civil ID<\u002Fdiv>\n                <input value=\"{{ lookupQuery }}\" sc-camel-on-change=\"{{ onLookupQuery }}\" placeholder=\"e.g. 30188 or 284091100123\" style=\"width:100%;min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 13px;font-size:15px;font-family:'JetBrains Mono'\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin-bottom:5px\">From date<\u002Fdiv>\n                <input type=\"date\" value=\"{{ lookupFrom }}\" sc-camel-on-change=\"{{ onLookupFrom }}\" style=\"min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 11px;font-size:14px;font-family:'JetBrains Mono';colorScheme:dark\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin-bottom:5px\">To date<\u002Fdiv>\n                <input type=\"date\" value=\"{{ lookupTo }}\" sc-camel-on-change=\"{{ onLookupTo }}\" style=\"min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 11px;font-size:14px;font-family:'JetBrains Mono';colorScheme:dark\">\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ clearLookupRange }}\" style=\"cursor:pointer;min-height:44px;padding:0 15px;border-radius:9px;border:1px solid #22334F;background:transparent;color:#8296B4;font-size:13.5px\">All time<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"color:#5C6E8A;font-size:12px;margin-top:8px;font-family:'JetBrains Mono'\">{{ lookupNote }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ lookupFound }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap\">\n              <div style=\"width:52px;height:52px;border-radius:50%;background:#1E2C44;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;font-size:20px\">{{ lk.initials }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:220px\">\n                <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:26px;letter-spacing:-.005em;line-height:1.1\">{{ lk.name }}<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:13px;font-family:'JetBrains Mono'\">{{ lk.ids }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right\">\n                <div style=\"color:#8296B4;font-size:12px;font-weight:600\">Status today<\u002Fdiv>\n                <div style=\"font-size:16px;color:{{ lk.statusTint }}\">{{ lk.statusToday }}<\u002Fdiv>\n                <div style=\"color:#5C6E8A;font-size:12px\">{{ lk.statusDetail }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px\">\n              <sc-for list=\"{{ lkStats }}\" as=\"s\" hint-placeholder-count=\"5\">\n                <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:14px 16px\">\n                  <div style=\"color:#8296B4;font-size:12px;font-weight:600\">{{ s.label }}<\u002Fdiv>\n                  <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:31px;color:{{ s.tint }};line-height:1.15;margin-top:4px\">{{ s.value }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#8296B4;line-height:1.4\">{{ s.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px;margin-bottom:14px\">\n              <div style=\"font-weight:600;font-size:15px\">Salary paid — every entry logged by Accounts<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12px\">{{ lkSalaryNote }}<\u002Fdiv>\n              <sc-if value=\"{{ lkSalaryEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"margin-top:12px;border:1px dashed #22334F;border-radius:10px;padding:20px;text-align:center;color:#8296B4;font-size:13px\">No salary entries posted for this driver yet.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ lkSalaryAny }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"overflow-x:auto\">\n                <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;min-width:720px\">\n                  <sc-raw-thead><sc-raw-tr>\n                    <sc-for list=\"{{ lkSalaryCols }}\" as=\"c\" hint-placeholder-count=\"7\">\n                      <sc-raw-th style=\"text-align:{{ c.align }};padding:8px 10px;border-bottom:1px solid #1E2C44;color:#8296B4;font-size:12px;font-weight:600\">{{ c.label }}<\u002Fsc-raw-th>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ lkSalaryRows }}\" as=\"r\" hint-placeholder-count=\"0\">\n                      <sc-raw-tr>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;font-family:'JetBrains Mono'\">{{ r.period }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;font-family:'JetBrains Mono';color:#8296B4\">{{ r.posted }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono'\">{{ r.stdH }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono';color:#F2A33C\">{{ r.otH }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono'\">{{ r.basic }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono';color:#F2A33C\">{{ r.otPay }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono';font-weight:700\">{{ r.total }}<\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:12px\">\n                <sc-for list=\"{{ lkSalaryTotals }}\" as=\"t\" hint-placeholder-count=\"3\">\n                  <div style=\"flex:1;min-width:170px;background:#0E1729;border:1px solid #1E2C44;border-radius:10px;padding:11px 13px\">\n                    <div style=\"color:#8296B4;font-size:12px;font-weight:600\">{{ t.label }}<\u002Fdiv>\n                    <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:24px;color:{{ t.tint }};line-height:1.1\">{{ t.value }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px\">\n              <div style=\"background:#111B2C;border:1px solid #4A2320;border-radius:11px;padding:16px 18px\">\n                <div style=\"font-weight:600;font-size:15px\">Accidents involved in<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:12px\">{{ lkAccidentNote }}<\u002Fdiv>\n                <sc-if value=\"{{ lkAccidentsEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"margin-top:12px;border:1px dashed #22334F;border-radius:10px;padding:20px;text-align:center;color:#8296B4;font-size:13px\">No accidents on record for this driver.<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:12px\">\n                  <sc-for list=\"{{ lkAccidents }}\" as=\"a\" hint-placeholder-count=\"0\">\n                    <div style=\"background:#0E1729;border:1px solid {{ a.bd }};border-radius:10px;padding:11px 13px;display:flex;gap:11px\">\n                      <div style=\"width:5px;align-self:stretch;min-height:38px;border-radius:4px;background:{{ a.tint }};flex:none\"><\u002Fdiv>\n                      <div style=\"flex:1;min-width:0\">\n                        <div style=\"display:flex;justify-content:space-between;gap:10px\">\n                          <span style=\"font-family:'JetBrains Mono';font-size:12.5px;color:#8296B4\">{{ a.date }} · {{ a.ref }}<\u002Fspan>\n                          <span style=\"font-family:'JetBrains Mono';font-size:12.5px;color:{{ a.tint }}\">{{ a.fault }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"font-size:13.5px;margin-top:3px\">TNK {{ a.tanker }} · {{ a.desc }}<\u002Fdiv>\n                        <div style=\"font-size:12.5px;color:#8296B4\">Repair {{ a.cost }}, deduction {{ a.deduction }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:#111B2C;border:1px solid #3E2A57;border-radius:11px;padding:16px 18px\">\n                <div style=\"font-weight:600;font-size:15px\">Vacations &amp; transfers<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:12px\">Oldest records are still here<\u002Fdiv>\n                <sc-if value=\"{{ lkAwayEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"margin-top:12px;border:1px dashed #22334F;border-radius:10px;padding:20px;text-align:center;color:#8296B4;font-size:13px\">No vacation or transfer records for this driver.<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:12px\">\n                  <sc-for list=\"{{ lkAway }}\" as=\"w\" hint-placeholder-count=\"0\">\n                    <div style=\"background:#0E1729;border:1px solid {{ w.bd }};border-radius:10px;padding:11px 13px;display:flex;gap:11px;align-items:center\">\n                      <div style=\"width:5px;align-self:stretch;min-height:34px;border-radius:4px;background:{{ w.tint }};flex:none\"><\u002Fdiv>\n                      <div style=\"flex:1;min-width:0\">\n                        <div style=\"font-size:13.5px;color:{{ w.tint }}\">{{ w.kind }}<\u002Fdiv>\n                        <div style=\"font-family:'JetBrains Mono';font-size:12px;color:#8296B4\">{{ w.range }}<\u002Fdiv>\n                        <div style=\"font-size:12.5px;color:#8296B4\">{{ w.detail }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n              <div style=\"font-weight:600;font-size:15px\">Trips completed<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12px\">{{ lkTripNote }}<\u002Fdiv>\n              <sc-if value=\"{{ lkTripsEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"margin-top:12px;border:1px dashed #22334F;border-radius:10px;padding:20px;text-align:center;color:#8296B4;font-size:13px\">No trips logged in this range.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ lkTripsAny }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"overflow-x:auto\">\n                <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;min-width:720px\">\n                  <sc-raw-thead><sc-raw-tr>\n                    <sc-for list=\"{{ lkTripCols }}\" as=\"c\" hint-placeholder-count=\"6\">\n                      <sc-raw-th style=\"text-align:{{ c.align }};padding:8px 10px;border-bottom:1px solid #1E2C44;color:#8296B4;font-size:12px;font-weight:600\">{{ c.label }}<\u002Fsc-raw-th>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ lkTripRows }}\" as=\"t\" hint-placeholder-count=\"0\">\n                      <sc-raw-tr>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;font-family:'JetBrains Mono';color:#8296B4\">{{ t.date }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;font-family:'JetBrains Mono'\">{{ t.id }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;font-family:'JetBrains Mono';color:#8296B4\">{{ t.tanker }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236\">{{ t.station }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236\">{{ t.product }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono'\">{{ t.qty }}<\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ lookupMiss }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#111B2C;border:1px dashed #4A2320;border-radius:11px;padding:30px;text-align:center\">\n              <div style=\"font-size:15px;color:#FF9A92\">No driver found for “{{ lookupQuery }}”<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:13px;margin-top:6px\">Check the Employee ID or Civil ID. Drivers appear here once they have saved their own profile on their phone.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showVacation }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px\">\n            <sc-for list=\"{{ vacStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"background:#111B2C;border:1px solid {{ s.bd }};border-radius:11px;padding:14px 16px\">\n                <div style=\"color:#8296B4;font-size:12px;font-weight:600\">{{ s.label }}<\u002Fdiv>\n                <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:32px;color:{{ s.tint }};line-height:1.15;margin-top:4px\">{{ s.value }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#8296B4;line-height:1.4\">{{ s.note }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px\">\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n              <div style=\"font-weight:600;font-size:15px\">Log a vacation<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12px;margin-bottom:12px\">Leave the return date blank if he has not said when he is back.<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin-bottom:5px\">Driver<\u002Fdiv>\n              <sc-raw-select value=\"{{ vacDriver }}\" sc-camel-on-change=\"{{ onVacDriver }}\" style=\"width:100%;min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 12px;font-size:14.5px\">\n                <option value=\"\">— select driver —<\u002Foption>\n                <sc-for list=\"{{ vacDriverOptions }}\" as=\"o\" hint-placeholder-count=\"0\">\n                  <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-select>\n              <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:12px\">\n                <div style=\"flex:1;min-width:150px\">\n                  <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin-bottom:5px\">Vacation start<\u002Fdiv>\n                  <input type=\"date\" value=\"{{ vacStart }}\" sc-camel-on-change=\"{{ onVacStart }}\" style=\"width:100%;min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 11px;font-size:14px;font-family:'JetBrains Mono';colorScheme:dark\">\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:150px\">\n                  <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin-bottom:5px\">Return date (if known)<\u002Fdiv>\n                  <input type=\"date\" value=\"{{ vacEnd }}\" sc-camel-on-change=\"{{ onVacEnd }}\" style=\"width:100%;min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 11px;font-size:14px;font-family:'JetBrains Mono';colorScheme:dark\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin:12px 0 5px\">Note<\u002Fdiv>\n              <input value=\"{{ vacNote }}\" sc-camel-on-change=\"{{ onVacNote }}\" placeholder=\"Annual leave, emergency leave, home country…\" style=\"width:100%;min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 12px;font-size:14px\">\n              <button sc-camel-on-click=\"{{ saveVacation }}\" style=\"cursor:pointer;width:100%;min-height:46px;margin-top:14px;border-radius:9px;border:0;background:#F2A33C;color:#0B1220;font-size:15px;font-weight:700\">Save vacation record<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n              <div style=\"font-weight:600;font-size:15px\">Who was on vacation on…<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12px;margin-bottom:12px\">Any date will do, including last year or next month.<\u002Fdiv>\n              <input type=\"date\" value=\"{{ vacQueryDate }}\" sc-camel-on-change=\"{{ onVacQueryDate }}\" style=\"width:100%;min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 11px;font-size:15px;font-family:'JetBrains Mono';colorScheme:dark\">\n              <div style=\"font-size:13px;color:#F2A33C;margin-top:10px\">{{ vacQueryNote }}<\u002Fdiv>\n              <sc-if value=\"{{ vacQueryEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"margin-top:12px;border:1px dashed #22334F;border-radius:10px;padding:20px;text-align:center;color:#8296B4;font-size:13px\">Nobody was on vacation on that date.<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:12px\">\n                <sc-for list=\"{{ vacQueryRows }}\" as=\"v\" hint-placeholder-count=\"0\">\n                  <div style=\"background:#0E1729;border:1px solid #4A3517;border-radius:10px;padding:11px 13px;display:flex;justify-content:space-between;gap:10px;align-items:center\">\n                    <div style=\"min-width:0\">\n                      <div style=\"font-size:14px\">{{ v.driver }}<\u002Fdiv>\n                      <div style=\"font-family:'JetBrains Mono';font-size:12px;color:#8296B4\">{{ v.range }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <span style=\"font-family:'JetBrains Mono';font-size:12px;color:#F2A33C;white-space:nowrap\">{{ v.day }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px\">\n            <div style=\"font-weight:600;font-size:15px\">Vacation log — all records<\u002Fdiv>\n            <div style=\"color:#8296B4;font-size:12px\">{{ vacLogNote }}<\u002Fdiv>\n            <sc-if value=\"{{ vacLogEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"margin-top:12px;border:1px dashed #22334F;border-radius:10px;padding:24px;text-align:center;color:#8296B4;font-size:13.5px\">No vacation records yet.<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ vacLogAny }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"overflow-x:auto\">\n              <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px;min-width:760px\">\n                <sc-raw-thead><sc-raw-tr>\n                  <sc-for list=\"{{ vacCols }}\" as=\"c\" hint-placeholder-count=\"6\">\n                    <sc-raw-th style=\"text-align:{{ c.align }};padding:8px 10px;border-bottom:1px solid #1E2C44;color:#8296B4;font-size:12px;font-weight:600\">{{ c.label }}<\u002Fsc-raw-th>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ vacRows }}\" as=\"v\" hint-placeholder-count=\"0\">\n                    <sc-ra ;background:#101C2E;border:1px solid #274067;border-radius:10px;padding:12px 14px\">\n              <div>\n                <div style=\"color:#8FB4EE;font-size:12px;letter-spacing:-.005em\">Station rate · fixed, read-only<\u002Fdiv>\n                <div style=\"font-size:15px\">{{ slabLabel }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:24px;color:#8FB4EE\">{{ slabRate }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin:16px 0 6px\">Quantity (litres)<\u002Fdiv>\n            <input value=\"{{ tripQty }}\" sc-camel-on-change=\"{{ onQty }}\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 31000\" style=\"width:100%;min-height:50px;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:0 13px;font-size:17px;font-family:'JetBrains Mono'\">\n            <div style=\"color:#5C6E8A;font-size:12px;margin-top:5px\">{{ tankerCapNote }}<\u002Fdiv>\n\n            <div style=\"margin-top:12px;display:flex;justify-content:space-between;align-items:center;background:#132A24;border:1px solid #2C7A66;border-radius:10px;padding:13px 14px\">\n              <div>\n                <div style=\"color:#7BE3C6;font-size:12px;letter-spacing:-.005em\">Rate category<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:12.5px\">Quantity and rate are captured as raw data — Accounts works out the amount<\u002Fdiv>\n              <\u002Fdiv>\n              <span style=\"font-family:'Barlow Condensed';font-weight:700;font-size:26px;color:#7BE3C6\">{{ tripRateCode }}<\u002Fspan>\n            <\u002Fdiv>\n\n            <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin:16px 0 6px\">Delivery note<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ attachPhoto }}\" style=\"cursor:pointer;width:100%;min-height:96px;border-radius:12px;border:1px dashed {{ photoBd }};background:#0B1220;color:{{ photo :10px;padding:11px 12px\">\n                <div style=\"font-family:'JetBrains Mono';font-size:17px;color:{{ dutyOTTint }}\">{{ dutyOT }}<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:10.5px;letter-spacing:-.005em\">OT<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin:18px 0 6px\">Shift starting KM<\u002Fdiv>\n            <input value=\"{{ form.dutyStartKm }}\" sc-camel-on-change=\"{{ fhDuty.startKm }}\" sc-camel-input-mode=\"decimal\" placeholder=\"284100\" style=\"width:100%;min-height:50px;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:0 13px;font-size:17px;font-family:'JetBrains Mono'\">\n            <button sc-camel-on-click=\"{{ attachStartPhoto }}\" style=\"cursor:pointer;width:100%;min-height:76px;margin-top:9px;border-radius:12px;border:1px dashed {{ startPhotoBd }};background:#0B1220;color:{{ startPhotoFg }};font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em\">{{ startPhotoLabel }}<\u002Fbutton>\n\n            <div style=\"color:#8296B4;font-size:12px;font-weight:600;margin:18px 0 6px\">Shift ending KM<\u002Fdiv>\n            <input value=\"{{ form.dutyEndKm }}\" sc-camel-on-change=\"{{ fhDuty.endKm }}\" sc-camel-input-mode=\"decimal\" placeholder=\"284282\" style=\"width:100%;min-height:50px;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:0 13px;font-size:17px;font-family:'JetBrains Mono'\">\n            <button sc-camel-on-click=\"{{ attachEndPhoto }}\" style=\"cursor:pointer;width:100%;min-height:76px;margin-top:9px;border-radius:12px;border:1px dashed {{ endPhotoBd }};background:#0B1220;color:{{ endPhotoFg }};font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em\">{{ endPhotoLabel }}<\u002Fbutton>\n\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin:18px 0 6px\">\n              <span style=\"color:#8 px\">\n                <span style=\"font-size:14px;color:#C7D6EA\">{{ c.label }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono';font-size:14px;color:#F2A33C\">{{ c.value }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ doShare }}\" style=\"cursor:pointer;width:100%;min-height:56px;border-radius:12px;border:0;background:#F2A33C;color:#0B1220;font-size:16.5px;font-weight:700\">Send to admin<\u002Fbutton>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px\">\n            <button sc-camel-on-click=\"{{ doDownload }}\" style=\"cursor:pointer;min-height:50px;border-radius:11px;border:1px solid #22334F;background:transparent;color:#C7D6EA;font-size:14px;font-weight:600\">Save file<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ doCopy }}\" style=\"cursor:pointer;min-height:50px;border-radius:11px;border:1px solid #22334F;background:transparent;color:#C7D6EA;font-size:14px;font-weight:600\">Copy code<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"color:#5C6E8A;font-size:12.5px;text-align:center;line-height:1.5\">This opens WhatsApp or email. If you are not sure it went, send it again; nothing is counted twice.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mJobs }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ goNewRepair }}\" style=\"cursor:pointer;width:100%;min-height:56px;border-radius:12px;border:0;background:#F2A33C;color:#0B1220;font-size:16.5px;font-weight:700\">+ New repair entry<\u002Fbutton>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ jobs }}\" as=\"j\" hint-placeholder-count=\"4\">\n              <div style=\"background:#111B2C;border:1px solid {{ j.bd }};border-radius:12px;padding:14px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center\">\n :#8296B4;font-size:12px;font-weight:600;margin:16px 0 6px\">Completion date<\u002Fdiv>\n            <input type=\"date\" value=\"{{ completionDateVal }}\" sc-camel-on-change=\"{{ onCompletionDate }}\" style=\"width:100%;min-height:50px;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:0 12px;font-size:16px;font-family:'JetBrains Mono';colorScheme:dark\">\n\n            <button sc-camel-on-click=\"{{ submitNewRepair }}\" style=\"cursor:pointer;width:100%;min-height:56px;margin-top:18px;border-radius:12px;border:0;background:#35C2A5;color:#06231C;font-size:17px;font-weight:700\">Save repair entry<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mList }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-if value=\"{{ showNewRepairCta }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ goNewRepair }}\" style=\"cursor:pointer;width:100%;min-height:56px;border-radius:12px;border:0;background:#F2A33C;color:#0B1220;font-size:16.5px;font-weight:700\">+ New repair entry<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mList }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <sc-for list=\"{{ listRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:12px;padding:13px 14px;display:flex;gap:12px;align-items:center\">\n                <div style=\"width:5px;align-self:stretch;min-height:40px;border-radius:4px;background:{{ r.tint }};flex:none\"><\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:14.5px\">{{ r.title }}<\u002Fdiv>\n                  <div style=\"color:#8296B4;font-size:12.5px\">{{ r.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align:right\">\n                  <div st
