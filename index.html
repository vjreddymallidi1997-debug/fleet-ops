              <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Status<\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <sc-for list=\"{{ statusChips }}\" as=\"s\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"cursor:pointer;flex:1;min-height:52px;border-radius:11px;font-size:14.5px;background:{{ s.bg }};border:1px solid {{ s.bd }};color:{{ s.fg }}\">{{ s.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ submitBreakdown }}\" style=\"cursor:pointer;width:100%;min-height:56px;margin-top:16px;border-radius:12px;border:0;background:#E5544B;color:#fff;font-size:17px;font-weight:700\">{{ breakdownCta }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mDaily }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:10px\">\n            <sc-for list=\"{{ dailySummary }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"flex:1;background:#111B2C;border:1px solid {{ s.bd }};border-radius:12px;padding:12px\">\n                <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:28px;color:{{ s.tint }};line-height:1.05\">{{ s.value }}<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:11px;letter-spacing:.08em;text-transform:uppercase\">{{ s.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-family:'JetBrains Mono';font-size:11.5px;color:#F2A33C;letter-spacing:.06em\">{{ dailyDate }}<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <sc-for list=\"{{ dailyStandard }}\" as=\"r\" hint-placeholder-count=\"8\">\n              <div style=\"background:#111B2C;border:1px solid {{ r.bd }};border-radius:12px;padding:13px 14px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n                  <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:21px;letter-spacing:.04em\">{{ r.no }}<\u002Fdiv>\n                  <div style=\"font-family:'JetBrains Mono';font-size:11.5px;color:#8296B4\">{{ r.plate }} · {{ r.cap }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:12.5px\">{{ r.driver }}<\u002Fdiv>\n                <div style=\"display:flex;gap:8px;margin-top:11px\">\n                  <sc-for list=\"{{ r.toggles }}\" as=\"t\" hint-placeholder-count=\"2\">\n                    <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"cursor:pointer;flex:1;min-height:52px;border-radius:11px;font-size:15px;font-weight:600;background:{{ t.bg }};border:1px solid {{ t.bd }};color:{{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <input value=\"{{ r.remarks }}\" sc-camel-on-change=\"{{ r.onRemarks }}\" placeholder=\"{{ r.remarksPh }}\" style=\"width:100%;min-height:48px;margin-top:9px;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:0 12px;font-size:15px\">\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mLog }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <sc-for list=\"{{ breakdownRows }}\" as=\"b\" hint-placeholder-count=\"4\">\n              <div style=\"background:#111B2C;border:1px solid {{ b.bd }};border-radius:12px;padding:13px 14px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n                  <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:21px;letter-spacing:.04em\">{{ b.tanker }}<\u002Fdiv>\n                  <span style=\"font-size:10.5px;font-family:'JetBrains Mono';letter-spacing:.1em;text-transform:uppercase;color:{{ b.tint }};border:1px solid {{ b.bd }};border-radius:20px;padding:3px 9px\">{{ b.status }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:14.5px;margin-top:2px\">{{ b.problem }}<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:12.5px\">{{ b.meta }}<\u002Fdiv>\n                <sc-if value=\"{{ b.canAdvance }}\" hint-placeholder-val=\"{{ false }}\">\n                  <button sc-camel-on-click=\"{{ b.onAdvance }}\" style=\"cursor:pointer;width:100%;min-height:48px;margin-top:11px;border-radius:10px;border:1px solid #22334F;background:#0B1220;color:#E6EDF7;font-size:15px;font-weight:600\">{{ b.advanceLabel }}<\u002Fbutton>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mSend }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#0E1729;border:1px solid #274067;border-radius:12px;padding:13px 14px\">\n            <div style=\"color:#8FB4EE;font-size:11px;letter-spacing:.16em;text-transform:uppercase\">Your records<\u002Fdiv>\n            <div style=\"font-size:15px;margin-top:4px\">{{ sendWho }}<\u002Fdiv>\n            <div style=\"color:#8296B4;font-size:12.5px;margin-top:5px;line-height:1.45\">Only the records your role enters are sent — listed below, nothing else. They stay on this phone until you send them.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ sendEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#111B2C;border:1px dashed #22334F;border-radius:12px;padding:24px;text-align:center;color:#8296B4;font-size:13.5px\">Nothing entered yet on this phone.<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <sc-for list=\"{{ sendCounts }}\" as=\"c\" hint-placeholder-count=\"0\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;background:#111B2C;border:1px solid #1E2C44;border-radius:10px;padding:11px 13px\">\n                <span style=\"font-size:14px;color:#C7D6EA\">{{ c.label }}<\u002Fspan>\n                <span style=\"font-family:'JetBrains Mono';font-size:14px;color:#F2A33C\">{{ c.value }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <button sc-camel-on-click=\"{{ doShare }}\" style=\"cursor:pointer;width:100%;min-height:56px;border-radius:12px;border:0;background:#F2A33C;color:#0B1220;font-size:16.5px;font-weight:700\">Send to admin<\u002Fbutton>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px\">\n            <button sc-camel-on-click=\"{{ doDownload }}\" style=\"cursor:pointer;min-height:50px;border-radius:11px;border:1px solid #22334F;background:transparent;color:#C7D6EA;font-size:14px;font-weight:600\">Save file<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ doCopy }}\" style=\"cursor:pointer;min-height:50px;border-radius:11px;border:1px solid #22334F;background:transparent;color:#C7D6EA;font-size:14px;font-weight:600\">Copy code<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"color:#5C6E8A;font-size:12.5px;text-align:center;line-height:1.5\">“Send to admin” opens WhatsApp or email. Sending twice is safe — nothing gets counted twice.<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mJobs }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ goNewRepair }}\" style=\"cursor:pointer;width:100%;min-height:56px;border-radius:12px;border:0;background:#F2A33C;color:#0B1220;font-size:16.5px;font-weight:700\">+ New repair entry<\u002Fbutton>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ jobs }}\" as=\"j\" hint-placeholder-count=\"4\">\n              <div style=\"background:#111B2C;border:1px solid {{ j.bd }};border-radius:12px;padding:14px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center\">\n                  <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:22px;letter-spacing:.04em\">{{ j.tanker }}<\u002Fdiv>\n                  <span style=\"font-size:11px;font-family:'JetBrains Mono';letter-spacing:.1em;text-transform:uppercase;color:{{ j.tint }};border:1px solid {{ j.bd }};border-radius:20px;padding:3px 9px\">{{ j.status }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font-size:14.5px;margin-top:4px\">{{ j.problem }}<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:12.5px\">{{ j.meta }}<\u002Fdiv>\n                <button sc-camel-on-click=\"{{ j.onOpen }}\" style=\"cursor:pointer;width:100%;min-height:50px;margin-top:12px;border-radius:10px;border:1px solid #22334F;background:#0B1220;color:#E6EDF7;font-size:15.5px;font-weight:600\">{{ j.cta }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mRepairForm }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:12px;padding:16px\">\n            <div style=\"background:#0B1220;border:1px solid #22334F;border-radius:10px;padding:13px 14px\">\n              <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:24px\">{{ jobTanker }}<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:13px\">{{ jobProblem }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Repair category<\u002Fdiv>\n            <div style=\"display:flex;gap:10px\">\n              <sc-for list=\"{{ categoryChips }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"cursor:pointer;flex:1;min-height:56px;border-radius:11px;font-size:15.5px;background:{{ c.bg }};border:1px solid {{ c.bd }};color:{{ c.fg }}\">{{ c.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Parts used<\u002Fdiv>\n            <textarea value=\"{{ form.parts }}\" sc-camel-on-change=\"{{ fh.parts }}\" rows=\"3\" placeholder=\"e.g. Air brake chamber x2, hose kit\" style=\"width:100%;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:12px 13px;font-size:16px;resize:vertical\"><\u002Ftextarea>\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Total cost (KD)<\u002Fdiv>\n            <input value=\"{{ form.cost }}\" sc-camel-on-change=\"{{ fh.cost }}\" sc-camel-input-mode=\"decimal\" placeholder=\"0.000\" style=\"width:100%;min-height:50px;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:0 13px;font-size:17px;font-family:'JetBrains Mono'\">\n\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Bills / invoices<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ bills }}\" as=\"b\" hint-placeholder-count=\"2\">\n                <div style=\"display:flex;align-items:center;gap:10px;background:#0B1220;border:1px solid #2C7A66;border-radius:10px;padding:11px 12px\">\n                  <span style=\"flex:1;font-family:'JetBrains Mono';font-size:13px;color:#7BE3C6\">{{ b.name }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ b.onRemove }}\" style=\"cursor:pointer;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #22334F;background:transparent;color:#8296B4;font-size:13px\">Remove<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ addBill }}\" style=\"cursor:pointer;width:100%;min-height:64px;margin-top:8px;border-radius:12px;border:1px dashed #22334F;background:#0B1220;color:#C7D6EA;font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px\">\n              <span>+ ADD BILL PHOTO OR PDF<\u002Fspan>\n              <span style=\"color:#5C6E8A\">{{ billCount }}<\u002Fspan>\n            <\u002Fbutton>\n\n            <button sc-camel-on-click=\"{{ submitRepair }}\" style=\"cursor:pointer;width:100%;min-height:56px;margin-top:18px;border-radius:12px;border:0;background:#35C2A5;color:#06231C;font-size:17px;font-weight:700\">Mark repair complete<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mAccidentForm }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:12px;padding:16px\">\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px\">Tanker<\u002Fdiv>\n            <sc-raw-select value=\"{{ form.tanker }}\" sc-camel-on-change=\"{{ fh.tanker }}\" style=\"width:100%;min-height:50px;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:0 12px;font-size:16px\">\n              <sc-for list=\"{{ tankerOptions }}\" as=\"o\" hint-placeholder-count=\"8\">\n                <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Driver<\u002Fdiv>\n            <sc-raw-select value=\"{{ form.driver }}\" sc-camel-on-change=\"{{ fh.driver }}\" style=\"width:100%;min-height:50px;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:0 12px;font-size:16px\">\n              <sc-for list=\"{{ driverOptions }}\" as=\"o\" hint-placeholder-count=\"8\">\n                <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Fault type<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ faultChips }}\" as=\"f\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"cursor:pointer;min-height:56px;border-radius:11px;font-size:16px;text-align:left;padding:0 15px;background:{{ f.bg }};border:1px solid {{ f.bd }};color:{{ f.fg }};display:flex;justify-content:space-between;align-items:center\">\n                  <span>{{ f.label }}<\u002Fspan><span style=\"font-family:'JetBrains Mono';font-size:11.5px\">{{ f.note }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-if value=\"{{ isDriverFault }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:16px;background:#0B1220;border:1px solid #4A2320;border-radius:11px;padding:13px 14px\">\n                <div style=\"color:#FF9A92;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px\">Driver employee ID / civil ID — required<\u002Fdiv>\n                <input value=\"{{ form.driverId }}\" sc-camel-on-change=\"{{ fh.driverId }}\" placeholder=\"e.g. 30188 or 284091100123\" style=\"width:100%;min-height:50px;background:#0E1729;border:1px solid #4A2320;border-radius:10px;color:#E6EDF7;padding:0 13px;font-size:16px;font-family:'JetBrains Mono'\">\n                <div style=\"font-size:13px;color:{{ driverIdTint }};margin-top:7px\">{{ driverIdNote }}<\u002Fdiv>\n                <sc-if value=\"{{ driverIdMatched }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"margin-top:9px;background:#0F241F;border:1px solid #1F5347;border-radius:10px;padding:11px 12px\">\n                    <div style=\"font-size:14.5px;color:#7BE3C6\">{{ driverIdName }}<\u002Fdiv>\n                    <div style=\"font-family:'JetBrains Mono';font-size:12px;color:#8296B4\">{{ driverIdRecord }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">What happened<\u002Fdiv>\n            <textarea value=\"{{ form.desc }}\" sc-camel-on-change=\"{{ fh.desc }}\" rows=\"3\" placeholder=\"Location, time, damage\" style=\"width:100%;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:12px 13px;font-size:16px;resize:vertical\"><\u002Ftextarea>\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Estimated repair cost (KD)<\u002Fdiv>\n            <input value=\"{{ form.cost }}\" sc-camel-on-change=\"{{ fh.cost }}\" sc-camel-input-mode=\"decimal\" placeholder=\"0.000\" style=\"width:100%;min-height:50px;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:0 13px;font-size:17px;font-family:'JetBrains Mono'\">\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Accident scene photos<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ scenePhotos }}\" as=\"p\" hint-placeholder-count=\"2\">\n                <span style=\"font-family:'JetBrains Mono';font-size:12px;color:#7BE3C6;background:#0B1220;border:1px solid #2C7A66;border-radius:8px;padding:8px 11px\">{{ p.name }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ addScenePhoto }}\" style=\"cursor:pointer;width:100%;min-height:64px;margin-top:8px;border-radius:12px;border:1px dashed #22334F;background:#0B1220;color:#C7D6EA;font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px\">\n              <span>+ ADD SCENE PHOTO<\u002Fspan><span style=\"color:#5C6E8A\">{{ sceneCount }}<\u002Fspan>\n            <\u002Fbutton>\n\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Vehicle damage photos<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ damagePhotos }}\" as=\"p\" hint-placeholder-count=\"2\">\n                <span style=\"font-family:'JetBrains Mono';font-size:12px;color:#FF9A92;background:#0B1220;border:1px solid #4A2320;border-radius:8px;padding:8px 11px\">{{ p.name }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ addDamagePhoto }}\" style=\"cursor:pointer;width:100%;min-height:64px;margin-top:8px;border-radius:12px;border:1px dashed #4A2320;background:#0B1220;color:#FF9A92;font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px\">\n              <span>+ ADD DAMAGE PHOTO<\u002Fspan><span style=\"color:#5C6E8A\">{{ damageCount }}<\u002Fspan>\n            <\u002Fbutton>\n\n            <div style=\"margin-top:12px;background:{{ deductNoteBg }};border:1px solid {{ deductNoteBd }};border-radius:10px;padding:12px 14px;font-size:13.5px;color:{{ deductNoteFg }}\">{{ deductNote }}<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ submitAccident }}\" style=\"cursor:pointer;width:100%;min-height:56px;margin-top:16px;border-radius:12px;border:0;background:#E5544B;color:#fff;font-size:17px;font-weight:700\">File accident report<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mDrivers }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:12px;padding:16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n              <div style=\"font-weight:600;font-size:15.5px\">Driver list<\u002Fdiv>\n              <div style=\"font-family:'JetBrains Mono';font-size:12px;color:#8296B4\">{{ driverCount }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"color:#8296B4;font-size:12.5px;margin-top:2px\">View only. Drivers appear here once they save their own profile on their phone.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ driverMasterEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#111B2C;border:1px dashed #22334F;border-radius:12px;padding:24px;text-align:center;color:#8296B4;font-size:13.5px\">Drivers appear here once they save their own profile.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <sc-for list=\"{{ driverMaster }}\" as=\"d\" hint-placeholder-count=\"0\">\n              <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px\">\n                <span style=\"font-family:'JetBrains Mono';font-size:12px;color:#5C6E8A\">{{ d.index }}<\u002Fspan>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:15px\">{{ d.name }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:{{ d.tint }}\">{{ d.assign }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mNewRepair }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:12px;padding:16px\">\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px\">Tanker number<\u002Fdiv>\n            <sc-raw-select value=\"{{ repairTankerVal }}\" sc-camel-on-change=\"{{ onRepairTanker }}\" style=\"width:100%;min-height:50px;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:0 12px;font-size:16px\">\n              <sc-for list=\"{{ tankerOptions }}\" as=\"o\" hint-placeholder-count=\"8\">\n                <option value=\"{{ o.value }}\">{{ o.label }}<\u002Foption>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-select>\n\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Problem description<\u002Fdiv>\n            <textarea value=\"{{ repairProblemVal }}\" sc-camel-on-change=\"{{ fh.problem }}\" rows=\"3\" placeholder=\"What is wrong with the tanker\" style=\"width:100%;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:12px 13px;font-size:16px;resize:vertical\"><\u002Ftextarea>\n            <div style=\"font-size:12px;color:{{ repairProblemTint }};margin-top:5px\">{{ repairProblemNote }}<\u002Fdiv>\n\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Repair category<\u002Fdiv>\n            <div style=\"display:flex;gap:10px\">\n              <sc-for list=\"{{ categoryChips }}\" as=\"c\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"cursor:pointer;flex:1;min-height:52px;border-radius:11px;font-size:15px;background:{{ c.bg }};border:1px solid {{ c.bd }};color:{{ c.fg }}\">{{ c.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Parts used<\u002Fdiv>\n            <textarea value=\"{{ form.parts }}\" sc-camel-on-change=\"{{ fh.parts }}\" rows=\"3\" placeholder=\"e.g. Air brake chamber x2, hose kit\" style=\"width:100%;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:12px 13px;font-size:16px;resize:vertical\"><\u002Ftextarea>\n\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Cost (KD)<\u002Fdiv>\n            <input value=\"{{ form.cost }}\" sc-camel-on-change=\"{{ fh.cost }}\" sc-camel-input-mode=\"decimal\" placeholder=\"0.000\" style=\"width:100%;min-height:50px;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:0 13px;font-size:17px;font-family:'JetBrains Mono'\">\n\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Bills / invoices<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <sc-for list=\"{{ bills }}\" as=\"b\" hint-placeholder-count=\"0\">\n                <div style=\"display:flex;align-items:center;gap:10px;background:#0B1220;border:1px solid #2C7A66;border-radius:10px;padding:11px 12px\">\n                  <span style=\"flex:1;font-family:'JetBrains Mono';font-size:13px;color:#7BE3C6\">{{ b.name }}<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ b.onRemove }}\" style=\"cursor:pointer;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #22334F;background:transparent;color:#8296B4;font-size:13px\">Remove<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ addBill }}\" style=\"cursor:pointer;width:100%;min-height:64px;margin-top:8px;border-radius:12px;border:1px dashed #22334F;background:#0B1220;color:#C7D6EA;font-family:'JetBrains Mono';font-size:12px;letter-spacing:.08em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px\">\n              <span>+ ADD BILL PHOTO OR PDF<\u002Fspan>\n              <span style=\"color:#5C6E8A\">{{ billCount }}<\u002Fspan>\n            <\u002Fbutton>\n\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Status<\u002Fdiv>\n            <div style=\"display:flex;gap:8px\">\n              <sc-for list=\"{{ repairStatusChips }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ s.onClick }}\" style=\"cursor:pointer;flex:1;min-height:52px;border-radius:11px;font-size:14.5px;background:{{ s.bg }};border:1px solid {{ s.bd }};color:{{ s.fg }}\">{{ s.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin:16px 0 6px\">Completion date<\u002Fdiv>\n            <input type=\"date\" value=\"{{ completionDateVal }}\" sc-camel-on-change=\"{{ onCompletionDate }}\" style=\"width:100%;min-height:50px;background:#0B1220;border:1px solid #22334F;border-radius:10px;color:#E6EDF7;padding:0 12px;font-size:16px;font-family:'JetBrains Mono';colorScheme:dark\">\n\n            <button sc-camel-on-click=\"{{ submitNewRepair }}\" style=\"cursor:pointer;width:100%;min-height:56px;margin-top:18px;border-radius:12px;border:0;background:#35C2A5;color:#06231C;font-size:17px;font-weight:700\">Save repair entry<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mList }}\" hint-placeholder-val=\"{{ false }}\">\n          <sc-if value=\"{{ showNewRepairCta }}\" hint-placeholder-val=\"{{ false }}\">\n            <button sc-camel-on-click=\"{{ goNewRepair }}\" style=\"cursor:pointer;width:100%;min-height:56px;border-radius:12px;border:0;background:#F2A33C;color:#0B1220;font-size:16.5px;font-weight:700\">+ New repair entry<\u002Fbutton>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ mList }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:11px\">\n            <sc-for list=\"{{ listRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n              <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:12px;padding:13px 14px;display:flex;gap:12px;align-items:center\">\n                <div style=\"width:5px;align-self:stretch;min-height:40px;border-radius:4px;background:{{ r.tint }};flex:none\"><\u002Fdiv>\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:14.5px\">{{ r.title }}<\u002Fdiv>\n                  <div style=\"color:#8296B4;font-size:12.5px\">{{ r.sub }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"text-align:right\">\n                  <div style=\"font-family:'JetBrains Mono';font-size:14px;color:{{ r.tint }}\">{{ r.value }}<\u002Fdiv>\n                  <div style=\"font-family:'JetBrains Mono';font-size:11px;color:#5C6E8A\">{{ r.meta }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n\n      <div style=\"position:sticky;bottom:0;background:#0E1729;border-top:1px solid #1E2C44;display:flex\">\n        <sc-for list=\"{{ mTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"cursor:pointer;flex:1;min-height:62px;border:0;background:transparent;color:{{ t.fg }};font-size:12.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-top:2px solid {{ t.bar }}\">\n            <span style=\"font-family:'Barlow Condensed';font-weight:700;font-size:16px;letter-spacing:.06em\">{{ t.abbr }}<\u002Fspan>\n            <span style=\"letter-spacing:.04em\">{{ t.label }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:940}}\">\nclass Component extends DCLogic {\n  constructor(p){\n    super(p);\n    const d = this.seed();\n    this._defaultDriver = (d.tankers.find(t => t.no === '414') || d.tankers[0]).driver;\n    this._defaultStation = d.stations[0].name;\n    this.state = Object.assign({\n      role: null, adminTab: 'Dashboard', screen: 'home', form: this.blankForm(),\n      toast: '', shiftType: 'Day', shiftOn: true, jobIdx: 0, tripFilter: 'All',\n      rosterShift: 'Day', swapIdx: 0, fuelTanker: '414', currentDriver: '', newDriver: '',\n      profile: { name: '', empId: '', civilId: '', mobile: '' }, staff: {}, salaryEntry: {},\n      vacations: [], salaryLedger: [], payEntry: {},\n      lookupQuery: '', lookupFrom: '', lookupTo: '',\n      vacQueryDate: '2026-08-16', vacForm: { driver: '', start: '', end: '', note: '' },\n      attSearch: '', attFilter: 'Unmarked', attGroupBy: false, attOpen: null,\n      newDrv: { name: '', empId: '', civilId: '', mobile: '' }, bulkText: '', drvSearch: '', confirmDrv: null,\n      importText: '', lastImport: ''\n    }, d, this.loadSaved());\n  }\n\n  /* ---------- saving to this device ----------\n     Everything except transient UI state is written to localStorage, so a\n     refresh, a closed tab or a restarted phone no longer loses the day's work.\n     This is still per-device: it is not a substitute for a shared backend. */\n  get LS_KEY(){ return 'knpc-fleet-ops-v1'; }\n  get NO_SAVE(){\n    return ['toast','role','screen','adminTab','form','lookupQuery','lookupFrom','lookupTo',\n      'attSearch','attFilter','attGroupBy','attOpen','vacQueryDate','vacForm','jobIdx','swapIdx',\n      'tripFilter','rosterShift','shiftType','shiftOn','newDriver','currentDriver','fuelTanker','assignSaved',\n      'confirmClear','savedOnce','newDrv','bulkText','drvSearch','confirmDrv','importText'];\n  }\n  loadSaved(){\n    try {\n      const raw = window.localStorage.getItem(this.LS_KEY);\n      if (!raw) return null;\n      const p = JSON.parse(raw);\n      if (!p || p.v !== 1 || !p.d) return null;\n      const deny = this.NO_SAVE, out = {};\n      Object.keys(p.d).forEach(k => { if (deny.indexOf(k) < 0) out[k] = p.d[k]; });\n      return out;\n    } catch (e) { return null; }\n  }\n  componentDidUpdate(){\n    clearTimeout(this._saveT);\n    this._saveT = setTimeout(() => {\n      try {\n        const out = {}, deny = this.NO_SAVE;\n        Object.keys(this.state).forEach(k => { if (deny.indexOf(k) < 0) out[k] = this.state[k]; });\n        window.localStorage.setItem(this.LS_KEY, JSON.stringify({ v: 1, at: Date.now(), d: out }));\n        if (!this.state.savedOnce) this.setState({ savedOnce: true });\n      } catch (e) { /* private mode / quota — app still works, just unsaved */ }\n    }, 400);\n  }\n  /* ---------- sending a day's work to Admin ----------\n     No server: each role exports the records entered on their own device, and\n     Admin merges them in. Merging is idempotent — importing the same file twice\n     never double-counts, so a foreman can safely re-send if unsure. */\n  /* A role may only ever send what that role can itself enter. Exporting the\n     whole state would put every driver's pay in a plain-text file on a foreman's\n     phone, which the role gating exists to prevent. */\n  get SHARE_KEYS(){\n    return {\n      driver:   ['dutyLog','trips'],\n      foreman:  ['attendance','roster','usage','pending','vacations'],\n      workshop: ['repairs','pending'],\n      safety:   ['accidents','deductions'],\n      accounts: ['salaryLedger','deductions'],\n      admin:    ['dutyLog','trips','attendance','roster','usage','pending','vacations','repairs','accidents','deductions','salaryLedger','drivers','driverIds']\n    }[this.state.role] || [];\n  }\n  get SHARE_LABELS(){\n    return { dutyLog: 'Duty logs', trips: 'Trips', attendance: 'Attendance marks', roster: 'Shift assignments',\n      usage: 'Tanker usage', pending: 'Breakdown reports', vacations: 'Vacation records', repairs: 'Repair jobs',\n      accidents: 'Accident reports', deductions: 'Deductions', salaryLedger: 'Salary entries', drivers: 'Drivers' };\n  }\n  /* Drivers only ever send their own rows, never the whole roster's. */\n  shareRows(k){\n    const S = this.state;\n    const me = (S.profile || {}).name || S.currentDriver || '';\n    const v = S[k];\n    if (k === 'attendance') return Object.assign({}, v);\n    if (!Array.isArray(v)) return v;\n    if (S.role === 'driver' && (k === 'dutyLog' || k === 'trips')) return v.filter(r => r.driver === me);\n    return v.slice();\n  }\n  exportPayload(){\n    const S = this.state, out = {};\n    this.SHARE_KEYS.forEach(k => { if (S[k] !== undefined) out[k] = this.shareRows(k); });\n    if (S.role === 'driver' && (S.profile || {}).name) {\n      out.drivers = [S.profile.name];\n      out.driverIds = { [S.profile.name]: { empId: S.profile.empId || '', civilId: S.profile.civilId || '', mobile: S.profile.mobile || '' } };\n    }\n    return { app: 'knpc-fleet-ops', v: 1, role: S.role, by: (S.profile || {}).name || (S.staff || {}).name || '', at: new Date().toISOString(), d: out };\n  }\n  exportText(){ return JSON.stringify(this.exportPayload()); }\n  shareCounts(){\n    const L = this.SHARE_LABELS;\n    return this.SHARE_KEYS.map(k => {\n      const r = this.shareRows(k);\n      const n = Array.isArray(r) ? r.length : Object.keys(r || {}).length;\n      return [L[k] || k, n];\n    }).filter(r => r[1] > 0);\n  }\n  downloadReport(){\n    try {\n      const S = this.state;\n      const who = ((S.profile || {}).name || (S.staff || {}).name || S.role || 'report').replace(/[^a-z0-9]+/gi, '-').toLowerCase();\n      const name = 'fleet-' + who + '-' + new Date().toISOString().slice(0, 10) + '.json';\n      const blob = new Blob([this.exportText()], { type: 'application/json' });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url; a.download = name;\n      document.body.appendChild(a); a.click(); a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 4000);\n      this.setState({ toast: 'Saved ' + name + ' — send that file to the admin' });\n    } catch (e) { this.setState({ toast: 'Could not save the file on this device.' }); }\n  }\n  shareReport(){\n    const txt = this.exportText();\n    try {\n      const S = this.state;\n      const who = ((S.profile || {}).name || (S.staff || {}).name || S.role || 'report').replace(/[^a-z0-9]+/gi, '-').toLowerCase();\n      const file = new File([txt], 'fleet-' + who + '-' + new Date().toISOString().slice(0, 10) + '.json', { type: 'application/json' });\n      if (navigator.canShare && navigator.canShare({ files: [file] })) {\n        navigator.share({ files: [file], title: 'Fleet Ops report' })\n          .then(() => this.setState({ toast: 'Sent to the admin' }))\n          .catch(() => {});\n        return;\n      }\n    } catch (e) { /* fall through */ }\n    this.downloadReport();\n  }\n  copyReport(){\n    const txt = this.exportText();\n    const done = () => this.setState({ toast: 'Code copied — paste it in a message to the admin' });\n    try {\n      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(done, () => this.downloadReport()); return; }\n    } catch (e) { /* fall through */ }\n    this.downloadReport();\n  }\n  mergePayload(raw){\n    let p;\n    try { p = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) { this.setState({ toast: 'That does not look like a Fleet Ops report.' }); return; }\n    if (!p || p.app !== 'knpc-fleet-ops' || !p.d) { this.setState({ toast: 'That does not look like a Fleet Ops report.' }); return; }\n    const d = p.d, added = [];\n    const keyOf = {\n      dutyLog: r => r.date + '|' + r.driver,\n      trips: r => r.id || (r.iso + '|' + r.tanker + '|' + r.qty),\n      accidents: r => r.ref,\n      deductions: r => (r.ref || '') + '|' + r.driver + '|' + r.amount,\n      salaryLedger: r => r.driver + '|' + r.period,\n      vacations: r => r.driver + '|' + r.start,\n      repairs: r => (r.ref || '') + '|' + r.tanker + '|' + (r.problem || ''),\n      pending: r => r.tanker + '|' + (r.problem || '') + '|' + (r.time || ''),\n      usage: r => r.tanker + '|' + (r.shift || '') + '|' + (r.start || '')\n    };\n    this.setState(st => {\n      const next = {};\n      Object.keys(keyOf).forEach(k => {\n        if (!Array.isArray(d[k])) return;\n        const mine = Array.isArray(st[k]) ? st[k].slice() : [];\n        const seen = {};\n        mine.forEach(r => { seen[keyOf[k](r)] = true; });\n        let n = 0;\n        d[k].forEach(r => { const id = keyOf[k](r); if (!seen[id]) { seen[id] = true; mine.push(r); n++; } });\n        if (n) { next[k] = mine; added.push(n + ' ' + k.replace(/([A-Z])/g, ' $1').toLowerCase()); }\n      });\n      /* roster is one row per tanker, so a changed assignment must REPLACE the\n         existing row — appending would silently drop the foreman's reassignment */\n      if (Array.isArray(d.roster)) {\n        const mine = (st.roster || []).slice();\n        let n = 0;\n        d.roster.forEach(r => {\n          const at = mine.findIndex(x => x.tanker === r.tanker);\n          if (at < 0) { mine.push(r); n++; return; }\n          const cur = mine[at];\n          if (cur.dayDriver !== r.dayDriver || cur.nightDriver !== r.nightDriver || cur.running !== r.running) {\n            mine[at] = Object.assign({}, cur, r); n++;\n          }\n        });\n        if (n) { next.roster = mine; added.push(n + ' shift assignments'); }\n      }\n      if (d.attendance) {\n        const att = Object.assign({}, st.attendance);\n        let n = 0;\n        Object.keys(d.attendance).forEach(k => { if (!att[k]) { att[k] = d.attendance[k]; n++; } });\n        if (n) { next.attendance = att; added.push(n + ' attendance marks'); }\n      }\n      /* a roster or duty row may name a driver this device has never seen —\n         add the name so the assignment is not left dangling */\n      const implied = [];\n      (next.roster || []).forEach(r => { [r.dayDriver, r.nightDriver].forEach(n2 => { if (n2 && implied.indexOf(n2) < 0) implied.push(n2); }); });\n      (d.dutyLog || []).forEach(r => { if (r.driver && implied.indexOf(r.driver) < 0) implied.push(r.driver); });\n      if (implied.length || Array.isArray(d.drivers)) {\n        const ds = st.drivers.slice(), ids = Object.assign({}, st.driverIds);\n        let n = 0;\n        implied.concat(d.drivers || []).forEach(nm => { if (ds.indexOf(nm) < 0) { ds.push(nm); n++; } });\n        Object.keys(d.driverIds || {}).forEach(nm => { if (!ids[nm]) ids[nm] = d.driverIds[nm]; });\n        if (n) { next.drivers = ds; added.push(n + ' drivers'); }\n        next.driverIds = ids;\n      }\n      next.importText = '';\n      next.lastImport = (p.by ? p.by : (p.role || 'team')) + ' · ' + (added.length ? added.join(', ') : 'nothing new')\n        + ' · ' + String(p.at || '').slice(0, 10);\n      next.toast = added.length ? 'Imported: ' + added.join(', ') : 'Already up to date — nothing new in that report.';\n      return next;\n    });\n  }\n  importFile(file){\n    if (!file) return;\n    const fr = new FileReader();\n    fr.onload = () => this.mergePayload(String(fr.result || ''));\n    fr.onerror = () => this.setState({ toast: 'Could not read that file.' });\n    fr.readAsText(file);\n  }\n\n  /* ---------- admin roster entry ---------- */\n  newDrvFor(k){\n    return e => { const v = e.target.value; this.setState(st => ({ newDrv: Object.assign({}, st.newDrv, { [k]: v }) })); };\n  }\n  addDriverRecord(rec, silent){\n    const name = String(rec.name || '').trim();\n    const empId = String(rec.empId || '').trim();\n    const civilId = String(rec.civilId || '').trim();\n    const mobile = String(rec.mobile || '').trim();\n    if (!name) { if (!silent) this.setState({ toast: 'Enter the driver’s full name.' }); return 'no-name'; }\n    if (!empId) { if (!silent) this.setState({ toast: 'Employee ID is required — it is how Accounts and Safety find this driver.' }); return 'no-emp'; }\n    const S = this.state;\n    if (S.drivers.indexOf(name) >= 0) { if (!silent) this.setState({ toast: name + ' is already on the roster.' }); return 'dupe-name'; }\n    const clash = S.drivers.find(n => {\n      const i = (S.driverIds || {})[n] || {};\n      return (empId && String(i.empId) === empId) || (civilId && i.civilId && String(i.civilId) === civilId);\n    });\n    if (clash) { if (!silent) this.setState({ toast: 'That ID already belongs to ' + clash + '.' }); return 'dupe-id'; }\n    this.setState(st => ({\n      drivers: st.drivers.concat([name]),\n      driverIds: Object.assign({}, st.driverIds, { [name]: { empId, civilId, mobile } }),\n      newDrv: { name: '', empId: '', civilId: '', mobile: '' },\n      toast: silent ? st.toast : name + ' added · EMP ' + empId\n    }));\n    return 'ok';\n  }\n  parseDriverList(text){\n    return String(text || '').split(/\\r?\\n/).map(l => l.trim()).filter(Boolean).map(line => {\n      const p = line.split(/[,\\t;]+/).map(x => x.trim());\n      return { name: p[0] || '', empId: p[1] || '', civilId: p[2] || '', mobile: p[3] || '' };\n    }).filter(r => r.name);\n  }\n  importDriverList(text){\n    const rows = this.parseDriverList(text);\n    if (!rows.length) { this.setState({ toast: 'Nothing to import — paste one driver per line.' }); return; }\n    let added = 0, skipped = 0;\n    rows.forEach(r => { if (this.addDriverRecord(r, true) === 'ok') added++; else skipped++; });\n    this.setState({\n      bulkText: '',\n      toast: added + ' driver' + (added === 1 ? '' : 's') + ' imported'\n        + (skipped ? ' · ' + skipped + ' skipped (missing Employee ID or already on the roster)' : '')\n    });\n  }\n  clearDemoData(){\n    this.setState({\n      drivers: [], driverIds: {}, trips: [], accidents: [], deductions: [], salaryLedger: [],\n      vacations: [], attendance: {}, dutyLog: [], staff: {},\n      toast: 'Demo records cleared — fleet list kept. Register your real drivers now.'\n    });\n  }\n\n  /* ---------- seed data ---------- */\n  get TODAY(){ return '16 Aug'; }\n  get TODAY_LONG(){ return 'Sunday, 16 August 2026'; }\n  get MONTH_DAYS(){ return 16; }\n  get RATE_TABLE(){ return { 1: 0.0085, 2: 0.0110, 3: 0.0145, 4: 0.0180, 5: 0.0215, 6: 0.0260 }; }\n  get RATE_KM(){ return { 1: '0–20 km', 2: '20–40 km', 3: '40–60 km', 4: '60–80 km', 5: '80–100 km', 6: '100+ km' }; }\n  stationOf(name){ return (this.state.stations || []).find(s => s.name === name) || null; }\n  rnd(){ this._s = (this._s || 20260816); this._s = (this._s * 1664525 + 1013904223) % 4294967296; return this._s / 4294967296; }\n  pick(a){ return a[Math.floor(this.rnd() * a.length)]; }\n\n  seed(){\n    const names = [];\n    const master = [\n      ['401',24000,'91-28444','Standard'],['402',24000,'91-57316','Standard'],['406',24000,'91-41695','Standard'],['410',24000,'91-41692','Standard'],\n      ['411',36000,'91-59395','Standard'],['412',36000,'91-58784','Standard'],['413',36000,'91-28318','Standard'],['414',36000,'91-58785','Standard'],\n      ['415',36000,'91-58789','Standard'],['416',36000,'91-58790','Standard'],['417',36000,'91-58691','Standard'],['418',36000,'91-58689','Standard'],\n      ['419',36000,'91-59365','Standard'],['420',36000,'91-59341','Standard'],['421',36000,'91-59394','Standard'],['422',36000,'91-58693','Standard'],\n      ['423',36000,'91-59324','Standard'],['424',36000,'91-57427','Standard'],['425',36000,'91-58235','Standard'],['426',36000,'91-59325','Standard'],\n      ['427',36000,'91-59360','Standard'],['428',36000,'91-59322','Standard'],['429',36000,'91-58690','Standard'],['430',36000,'91-58692','Standard'],\n      ['607',24000,'91-57408','Standard'],['608',24000,'91-39242','Standard'],['609',24000,'91-39245','Standard'],['610',24000,'91-39246','Standard'],\n      ['404',24000,'91-41879','Spare'],['408',24000,'91-41688','Spare'],['431',36000,'91-41689','Spare'],['432',36000,'91-41690','Spare'],\n      ['433',36000,'91-57071','Spare'],['434',36000,'91-57066','Spare'],['435',36000,'91-57070','Spare'],['436',36000,'91-57069','Spare'],\n      ['437',36000,'91-57067','Spare'],['438',36000,'91-57068','Spare'],['439',36000,'91-56856','Spare']\n    ];\n    const workshopReasons = ['Air brake leak — chamber replacement','Coolant overheating, radiator core','Loading valve jam','Tyre burst rear axle','Alternator not charging','Accident damage — panel work'];\n    const tankers = master.map((m, i) => {\n      const spare = m[3] === 'Spare';\n      const inWs = !spare && (i === 3 || i === 12 || i === 21);\n      return {\n        no: m[0], cap: m[1], plate: m[2], category: m[3],\n        fuelCap: m[1] === 24000 ? 300 : 400,\n        kind: (m[1] / 1000) + ' kL · ' + m[3], location: spare ? 'KNPC Extra-SP' : 'Ahmadi',\n        minQty: m[1] === 24000 ? 20000 : 31000,\n        driver: '',\n        odo: 180000 + Math.floor(this.rnd() * 220000),\n        status: spare ? 'Spare' : (inWs ? 'In Workshop' : 'On Work'),\n        remarks: inWs ? workshopReasons[i % workshopReasons.length] : ''\n      };\n    });\n\n    const knpcMap = [['#6',2],['#10',3],['#12',1],['#16',4],['#24',2],['#29',2],['#36',1],['#37',3],['#39',6],['#47',3],['#54',2],['#59',4],['#62',2],['#64',3],['#69',2],['#73',1],['#78',1],['#88',3],['#93',1],['#94',3],['#102',4],['#105',3],['#112',1],['#114',1],['#118',1],['#119',2],['#126',3],['#127',2],['#128',6],['#129',4],['#131',3],['#132',4],['#133',4],['#138',2],['#139',3],['#140',3],['#141',3],['#142',2],['#143',3],['#144',3],['#145',3],['#149',3],['#157',3],['#158',3],['#165',3],['#506',3],['#507',3]];\n    const custMap = [['G-SMOOD',3],['KAZMA CAMP',5],['KUWAIT OIL TANKER COMPANY-289',1],['MINA ABDULLA R',1],['NEW KAFCO',2],['OLD KAFCO',2],['OM ALAISH',6],['RAI SALMIYA',3],['RIGGAI',3],['SHUAIBA 1','Valve seal kit','Alternator 24V, belt','Bush set, U-bolts']),\n        category: acc ? 'Accident' : 'Normal',\n        cost: Math.round((acc ? 340 + this.rnd() * 900 : 45 + this.rnd() * 260) * 10) / 10,\n        status: i < 3 ? (i === 0 ? 'In progress' : 'Awaiting parts') : 'Completed',\n        month: 2 + Math.floor(this.rnd() * 6)\n      });\n    }\n\n    const accidents = [\n      { tanker: '414', driver: '', empId: '', civilId: '', iso: '2026-08-11', fault: 'Driver fault', desc: 'Reversing impact at Subhan Garage gate, rear guard bent', cost: 620.5, ref: 'ACC-0031' },\n      { tanker: '417', driver: '', empId: '', civilId: '', iso: '2026-08-07', fault: 'Third-party fault', desc: 'Rear-ended near Station #114 by private car', cost: 1180.0, ref: 'ACC-0030' },\n      { tanker: '426', driver: '', empId: '', civilId: '', iso: '2026-07-29', fault: 'Driver fault', desc: 'Kerb strike on Ring 6, front tyre and rim damage', cost: 310.0, ref: 'ACC-0029' },\n      { tanker: '410', driver: '', empId: '', civilId: '', iso: '2026-07-18', fault: 'Company fault', desc: 'Brake failure — overdue service interval', cost: 845.0, ref: 'ACC-0028' },\n      { tanker: '608', driver: '', empId: '', civilId: '', iso: '2026-06-30', fault: 'Driver fault', desc: 'Mirror and side panel scrape in Riggai yard', cost: 195.0, ref: 'ACC-0027' }\n    ];\n    const deductions = accidents.filter(a => a.fault === 'Driver fault').map(a => ({\n      driver: a.driver, tanker: a.tanker, ref: a.ref, desc: a.desc, repair: a.cost, amount: Math.round(a.cost * 0.35 * 10) / 10\n    }));\n\n    const pending = [\n      { tanker: '423', problem: 'Coolant overheating', driver: 'Foreman', time: '16 Aug 11:12', status: 'Pending' },\n      { tanker: '419', problem: 'Loading valve jam', driver: 'Foreman', time: '16 Aug 12:03', status: 'In progress' },\n      { tanker: '410', problem: 'Air brake leak — pressure dropping', driver: 'Foreman', time: '15 Aug 06:42', status: 'Fixed' },\n      { tanker: '609', problem: 'Alternator not charging', driver: 'Foreman', time: '14 Aug 19:20', status: 'Fixed' }\n    ];\n    /* 90-driver roster — the real contract headcount, so the foreman's\n       marking screen and Driver Lookup are exercised at true scale */\n    const firsts = ['Rakesh','Sunil','Anil','Mahesh','Ramesh','Dinesh','Suresh','Vinod','Ajay','Manoj',\n      'Prakash','Santosh','Deepak','Sanjay','Rajesh','Naveen','Pradeep','Ashok','Vijay','Arun',\n      'Mohammed','Abdul','Ibrahim','Yousef','Khaled','Salem','Nasser','Faisal','Tariq','Bilal',\n      'Imran','Zahid','Kamran','Shahid','Asif','Nadeem','Waseem','Irfan','Amjad','Rizwan',\n      'Joseph','Thomas','Biju','Shaji','Anoop','Rejith','Praveen','Sujith','Vinu','Manu'];\n    const lasts = ['Kumar','Sharma','Singh','Patel','Nair','Menon','Pillai','Reddy','Yadav','Verma',\n      'Hassan','Ali','Khan','Rahman','Iqbal','Aslam','Mahmood','Siddiqui','Farooq','Chaudhry',\n      'Thomas','George','Mathew','Jacob','Varghese'];\n    const drivers = [];\n    const driverIds = {};\n    for (let i = 0; i < 90; i++) {\n      let nm = firsts[i % firsts.length] + ' ' + lasts[(i * 7 + 3) % lasts.length];\n      while (drivers.indexOf(nm) >= 0) nm = nm + ' ' + String.fromCharCode(65 + (i % 26));\n      drivers.push(nm);\n      driverIds[nm] = {\n        empId: String(30101 + i * 3),\n        civilId: '2' + String(84 + (i % 9)) + '0' + String(91100120 + i * 137),\n        mobile: '+965 ' + String(5 + (i % 5)) + String(1000000 + i * 7919).slice(0, 7)\n      };\n    }\n    const roster = tankers.map((t, i) => ({\n      tanker: t.no, running: t.category === 'Standard' && t.status !== 'In Workshop',\n      dayDriver: t.category === 'Standard' && t.status !== 'In Workshop' ? (drivers[i * 2] || '') : '',\n      nightDriver: t.category === 'Standard' && t.status !== 'In Workshop' ? (drivers[i * 2 + 1] || '') : ''\n    }));\n\n    /* attach the roster to the historical records so Driver Lookup has real\n       all-time history to report against */\n    const driverFor = (tankerNo, shift) => {\n      const r = roster.find(x => x.tanker === tankerNo);\n      const pickd = r && (shift === 'Night' ? r.nightDriver : r.dayDriver);\n      return pickd || drivers[(parseInt(tankerNo, 10) || 0) % drivers.length];\n    };\n    trips.forEach(t => { t.driver = driverFor(t.tanker, t.shift); });\n    accidents.forEach((a, i) => {\n      a.driver = driverFor(a.tanker, i % 2 ? 'Night' : 'Day');\n      const ids = driverIds[a.driver] || {};\n      a.empId = ids.empId || '';\n      a.civilId = ids.civilId || '';\n    });\n    deductions.forEach(d => {\n      const a = accidents.find(x => x.ref === d.ref);\n      if (a) d.driver = a.driver;\n    });\n\n    /* two years of posted payroll — proves the record survives across years */\n    const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n    const salaryLedger = [];\n    for (let y = 2024; y <= 2026; y++) {\n      for (let m = 0; m < 12; m++) {\n        if (y === 2024 && m < 7) continue;\n        if (y === 2026 && m > 6) continue;\n        const mm = String(m + 1).padStart(2, '0');\n        drivers.forEach((nm, di) => {\n          const otH = Math.round((14 + this.rnd() * 46) * 10) / 10;\n          const basic = 190 + ((di * 7) % 11) * 12;\n          salaryLedger.push({\n            driver: nm, period: MON[m] + ' ' + y,\n            iso: y + '-' + mm + '-28',\n            stdH: 208, otH,\n            basic: basic, otPay: Math.round(otH * 1.35 * 1000) / 1000,\n            by: 'Accounts'\n          });\n        });\n      }\n    }\n    salaryLedger.sort((a, b) => (a.iso < b.iso ? 1 : -1));\n\n    const usage = [\n      { tanker: '414', driver: '', shift: 'Day', start: '05:40', end: '', replacedBy: '', count: 0 },\n      { tanker: '423', driver: '', shift: 'Day', start: '05:35', end: '11:12', replacedBy: '431', count: 1 },\n      { tanker: '431', driver: '', shift: 'Day', start: '11:48', end: '', replacedBy: '', count: 0 },\n      { tanker: '419', driver: '', shift: 'Night', start: '17:30', end: '', replacedBy: '', count: 0 },\n      { tanker: '607', driver: '', shift: 'Day', start: '05:44', end: '', replacedBy: '', count: 0 }\n    ];\n\n    return {\n      drivers, driverIds, tankers, stations, trips, repairs, accidents, deductions, salaryLedger, pending, products,\n      roster, usage, dutyLog: [], attendance: {},\n      vacations: [\n        { driver: drivers[4], start: '2026-08-02', end: '2026-08-24', note: 'Annual leave — home country' },\n        { driver: drivers[17], start: '2026-08-11', end: '', note: 'Emergency leave — return date not known' },\n        { driver: drivers[33], start: '2026-07-05', end: '2026-07-28', note: 'Annual leave' },\n        { driver: drivers[58], start: '2026-08-14', end: '2026-09-06', note: 'Annual leave — home country' },\n        { driver: drivers[71], start: '2025-11-09', end: '2025-12-04', note: 'Annual leave' }\n      ],\n      dayForeman: '', nightForeman: '', assignSaved: false\n    };\n  }\n\n  staffFor(role, k){ return e => { const v = e.target.value; this.setState(st => ({ staff: Object.assign({}, st.staff, { [role]: Object.assign({ name: '', empId: '' }, st.staff[role], { [k]: v }) }) })); }; }\n\n  profFor(k){ return e => { const v = e.target.value; this.setState(st => ({ profile: Object.assign({}, st.profile, { [k]: v }) })); }; }\n\n  blankForm(){ return { station: this._defaultStation || 'Station #6', product: 'Diesel', qty: '', photo: '', tanker: '414', problem: '', problemType: '', driver: this._defaultDriver || '', desc: '', fault: 'Driver fault', category: 'Normal', parts: '', cost: '', status: 'Pending',\n      checkIn: '', checkOut: '', dutyShift: '', depot: 'Ahmadi Depot', dutyStartKm: '', dutyEndKm: '', dutyDiesel: '', dutyOpenPct: '', dutyClosePct: '', startPhoto: '', endPhoto: '',\n      bills: [], scenePhotos: [], damagePhotos: [], swapOld: '', swapEnd: '', swapStart: '', swapTanker: '',\n      repairStatus: 'In Progress', completionDate: '', driverId: '' };\n  }\n\n  /* ---------- helpers ---------- */\n  set(k, v){ this.setState(s => ({ form: Object.assign({}, s.form, { [k]: v }) })); }\n  fhFor(k){ this._h = this._h || {}; if (!this._h[k]) this._h[k] = e => this.set(k, e.target.value); return this._h[k]; }\n  go(screen){ this.setState({ screen, toast: '' }); }\n  flash(msg, screen){ this.setState({ toast: msg, screen: screen || 'home', form: this.blankForm() }); }\n  kd(n){ return 'KD ' + Number(n).toLocaleString('en-US', { minimumFractionDigits: n < 100 ? 3 : 0, maximumFractionDigits: n < 100 ? 3 : 0 }); }\n  /* ---------- long-term records: dates, attendance status, vacation ---------- */\n  get ISO_TODAY(){ return '2026-08-16'; }\n  get AWAY_STATUSES(){ return ['Present', 'Absent', 'Transferred — Other Project', 'Transferred — GCC Project']; }\n  get STATUS_TINT(){ return { 'Present': '#35C2A5', 'Absent': '#8296B4', 'Absent / off': '#8296B4', 'On vacation': '#F2A33C', 'Transferred — Other Project': '#C08BF0', 'Transferred — GCC Project': '#4C8DF6' }; }\n  get STATUS_BD(){ return { 'Present': '#1F5347', 'Absent': '#22334F', 'Absent / off': '#22334F', 'On vacation': '#4A3517', 'Transferred — Other Project': '#3E2A57', 'Transferred — GCC Project': '#274067' }; }\n  fmtD(iso){\n    if (!iso) return '—';\n    const p = String(iso).split('-');\n    const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n    return p.length === 3 ? (p[2] + ' ' + (M[+p[1] - 1] || p[1]) + ' ' + p[0]) : String(iso);\n  }\n  idsFor(name){\n    const S = this.state, P = S.profile || {};\n    return Object.assign({}, (S.driverIds || {})[name],\n      P.name === name ? { empId: P.empId, civilId: P.civilId, mobile: P.mobile } : null);\n  }\n  attRec(name, iso){\n    const r = (this.state.attendance || {})[name + '|' + (iso || this.ISO_TODAY)];\n    if (r && typeof r === 'object') return r;\n    if (typeof r === 'string' && r) return { status: r, project: '' };\n    return null;\n  }\n  vacationOn(name, iso){\n    return (this.state.vacations || []).find(v => v.driver === name && v.start && v.start <= iso && (!v.end || v.end >= iso)) || null;\n  }\n  effStatus(name, iso){\n    const day = iso || this.ISO_TODAY;\n    const r = this.attRec(name, day);\n    if (r && r.status) return { status: r.status, project: r.project || '' };\n    const v = this.vacationOn(name, day);\n    if (v) return { status: 'On vacation', project: (v.note || 'Vacation') + ' · back ' + (v.end ? this.fmtD(v.end) : 'date not known') };\n    const logged = (this.state.dutyLog || []).some(l => l.driver === name && l.date === this.TODAY);\n    return { status: logged ? 'Present' : 'Absent / off', project: '' };\n  }\n  setAtt(name, status){\n    const key = name + '|' + this.ISO_TODAY;\n    this.setState(st => ({\n      attendance: Object.assign({}, st.attendance, {\n        [key]: { status, project: status.indexOf('Transferred') === 0 ? ((st.attendance[key] || {}).project || '') : '' }\n      }),\n      toast: name + ' → ' + status\n    }));\n  }\n  setAttProject(name, project){\n    const key = name + '|' + this.ISO_TODAY;\n    this.setState(st => ({\n      attendance: Object.assign({}, st.attendance, {\n        [key]: Object.assign({ status: 'Transferred — Other Project' }, st.attendance[key], { project })\n      })\n    }));\n  }\n  donut(items){\n    const total = items.reduce((a, b) => a + b.v, 0) || 1, C = 2 * Math.PI * 54;\n    let acc = 0;\n    return items.map(it => {\n      const f = it.v / total, seg = f * C;\n      const o = Object.assign({}, it, {\n        dash: (Math.max(seg - 2, 0)).toFixed(1) + ' ' + (C - Math.max(seg - 2, 0)).toFixed(1),\n        offset: (-acc * C).toFixed(1),\n        pctLabel: Math.round(f * 100) + '%'\n      });\n      acc += f; return o;\n    });\n  }\n  line(vals, pad){\n    const mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals), sp = (mx - mn) || 1;\n    return vals.map((v, i) => {\n      const x = 10 + i * (580 / (vals.length - 1));\n      const y = 172 - ((v - mn) / sp) * (150 - (pad || 0));\n      return { x: x.toFixed(1), y: y.toFixed(1) };\n    });\n  }\n\n  /* ---------- render values ---------- */\n  renderVals(){\n    const S = this.state, R = S.role;\n    const TODAY = this.TODAY, TODAY_LONG = this.TODAY_LONG, MONTH_DAYS = this.MONTH_DAYS;\n    const roles = [\n      { key: 'admin', name: 'Admin / Dispatcher', abbr: 'AD', desc: 'Full operations dashboard, trips, fleet, costs', platform: 'Web · desktop', tint: '#F2A33C' },\n      { key: 'driver', name: 'Driver', abbr: 'DR', desc: 'Log trips, shift clock, report breakdowns', platform: 'Mobile', tint: '#35C2A5' },\n      { key: 'foreman', name: 'Foreman', abbr: 'FM', desc: 'Triage driver faults, dispatch to workshop', platform: 'Mobile', tint: '#4C8DF6' },\n      { key: 'workshop', name: 'Workshop / Mechanic', abbr: 'WS', desc: 'Repair jobs, parts and cost logging', platform: 'Mobile', tint: '#C08BF0' },\n      { key: 'safety', name: 'Safety Supervisor', abbr: 'SF', desc: 'Accident reports, fault type, deductions', platform: 'Mobile', tint: '#E5544B' },\n      { key: 'accounts', name: 'Accounts', abbr: 'AC', desc: 'Payroll, deductions, billing by rate slab', platform: 'Web · desktop', tint: '#7BE3C6' }\n    ];\n    const roleMeta = {};\n    roles.forEach(r => roleMeta[r.key] = r);\n    const isDesk = R === 'admin' || R === 'accounts';\n    const isMobile = !!R && !isDesk;\n\n    /* aggregates */\n    const trips = S.trips;\n    const byProduct = S.products.map((p, i) => ({\n      label: p, v: trips.filter(t => t.product === p).length,\n      color: ['#F2A33C','#4C8DF6','#35C2A5','#C08BF0','#E5544B'][i]\n    }));\n    const slabAgg = {};\n    trips.forEach(t => { slabAgg[t.rateCode] = (slabAgg[t.rateCode] || 0) + 1; });\n    const slabKeys = [1, 2, 3, 4, 5, 6];\n    const slabRanges = ['0–20','20–40','40–60','60–80','80–100','100+'];\n    const slabMax = Math.max.apply(null, slabKeys.map(k => slabAgg[k] || 0)) || 1;\n    const totalQty = trips.reduce(( , km: 0, hours: 0, litres: 0 };\n      a.trips++; a.km += 80; a.hours += t.hours; a.litres += t.litres; a.qty = (a.qty || 0) + t.qty; a.rev = (a.rev || 0) + t.revenue;\n    });\n    const driverPerf = S.drivers.map(name => {\n      const ts = S.trips.filter(t => t.driver === name);\n      const ls = S.dutyLog.filter(l => l.driver === name);\n      const a = S.roster.find(r => r.running && (r.dayDriver === name || r.nightDriver === name));\n      const km = ls.reduce((x, l) => x + (l.endKm - l.startKm), 0);\n      const fuel = ls.reduce((x, l) => x + (l.consumed || 0), 0);\n      return {\n        name, tanker: a ? 'TNK ' + a.tanker : '—', trips: ts.length,\n        km: (ts.reduce((x, t) => x + t.qty, 0) / 1000).toFixed(0) + ' kL',\n        hours: ls.reduce((x, l) => x + l.net, 0).toFixed(1),\n        ot: ls.reduce((x, l) => x + l.ot, 0).toFixed(1),\n        mileage: fuel > 0 ? (km / fuel).toFixed(2) : '—'\n      };\n    }).sort((a, b) => b.trips - a.trips).slice(0, 8);\n    const perfEmpty = S.drivers.length === 0;\n\n    const dayTrips = trips.filter(t => t.shift === 'Day').length;\n    const nightTrips = trips.length - dayTrips;\n    const shiftCards = [\n      { label: 'Day shift', trips: dayTrips, hours: dayTrips * 8, ot: Math.round(dayTrips * 1.2), tint: '#F2A33C', w: Math.round(dayTrips / trips.length * 100) + '%' },\n      { label: 'Night shift', trips: nightTrips, hours: nightTrips * 8, ot: Math.round(nightTrips * 1.6), tint: '#4C8DF6', w: Math.round(nightTrips / trips.length * 100) + '%' }\n    ];\n\n    const normalTotal = this.kd(Math.round(S.repairs.filter(r => r.category === 'Normal').reduce((a, b) => a + b.cost, 0)));\n    const accidentTotal = this.kd(Math.round(S.repairs.filter(r => r.category === 'Accident').reduce((a, b) => a + b.cost, 0)));\n    const deductTotalNum = S.deductions.reduce((a, b) => a + b.amount, 0);\n    const dMax = Math.max.apply(null, S.deductions.map(d => d.amount).concat([1]));\n\n    const prodColor = { 'Diesel': ['#3A2A12',' \n    const kmNum = (!isNaN(dsk) && !isNaN(dek) && dek > dsk) ? dek - dsk : NaN;\n    const consumedNum = (!isNaN(opct) && !isNaN(cpct) && !isNaN(ddl))\n      ? (opct / 100) * myTank + ddl - (cpct / 100) * myTank : NaN;\n    const mpgNum = (!isNaN(kmNum) && !isNaN(consumedNum) && consumedNum > 0) ? kmNum / consumedNum : NaN;\n    const duty = {\n      workedNum, netNum, otNum, kmNum, mpgNum, consumedNum,\n      tankCap: myTank + ' L tank',\n      consumed: isNaN(consumedNum) ? '—' : consumedNum.toFixed(1) + ' L',\n      consumedTint: (!isNaN(consumedNum) && consumedNum <= 0) ? '#E5544B' : '#F2A33C',\n      formula: (!isNaN(opct) && !isNaN(cpct) && !isNaN(ddl))\n        ? '(' + opct + '% × ' + myTank + ') + ' + ddl + ' L − (' + cpct + '% × ' + myTank + ')'\n        : 'Enter opening %, diesel filled and closing %',\n      worked: isNaN(workedNum) ? '—' : workedNum.toFixed(1) + ' h',\n      net: isNaN(netNum) ? '—' : netNum.toFixed(1) + ' h',\n      ot: isNaN(netNum) ? '—' : otNum.toFixed(1) + ' h',\n      km: isNaN(kmNum) ? '—' : kmNum + ' km',\n      mileage: isNaN(mpgNum) ? '—' : mpgNum.toFixed(2) + ' km/L'\n    };\n    const swapRec = S.usage[S.swapIdx] || S.usage[0] || { tanker: '—', driver: '—', start: '—', shift: 'Day' };\n\n    const fuelStats = S.tankers.filter(t => t.category === 'Standard').map((t, ti) => {\n      const days = [];\n      let km = 0, litres = 0;\n      const hash = s => { let x = Math.sin(s) * 43758.5453; return x - Math.floor(x); };\n      const centre = 3.02 + hash(ti + 1) * 0.62;\n      const p1 = 6 + hash(ti + 31) * 9, p2 = 13 + hash(ti + 71) * 11;\n      const a1 = 0.05 + hash(ti + 17) * 0.11, a2 = 0.03 + hash(ti + 53) * 0.07;\n      const ph = hash(ti + 97) * 6.28, drift = (hash(ti + 131) - 0.5) * 0.24;\n      let walk = 0;\n      for (let d = 1; d <= 30; d++) {\n        walk = walk * 0.72 + (hash(ti * 97 + d * 7.31) - 0.5) * 0.16;\n        const base = Math.max(2.4, centre\n          + Math.sin((d / p1) * 6.28 + ph) * a1\n          + Math.sin((d / p2) * 6.28 + ph * 1.7) * a2\n          + drift * (d / 30) + walk);\n        const dayKm = 150 + Math.round(hash(ti * 13 + d * 3.7) * 95);\n        km += dayKm; litres += dayKm / base;\n        days.push(base);\n      }\n      S.dutyLog.filter(x => x.tanker === t.no && x.consumed > 0).forEach(x => { km += (x.endKm - x.startKm); litres += x.consumed; });\n      return { no: t.no, plate: t.plate, driver: (S.roster.find(r => r.tanker === t.no) || {}).dayDriver || '—', fuelCap: t.fuelCap, km: Math.round(km), litres: Math.round(litres), avg: km / litres, days };\n    }).sort((a, b) => b.avg - a.avg);\n    const fleetAvg = fuelStats.reduce((a, s) => a + s.avg, 0) / (fuelStats.length || 1);\n    const fuelMax = fuelStats[0] ? fuelStats[0].avg : 1;\n    const fuelPick = fuelStats.find(s => s.no === S.fuelTanker) || fuelStats[0];\n    if (fuelPick) fuelPick.pts = this.line(fuelPick.days, 10);\n\n    /* ---------- permanent records: vacation, transfers, driver lookup ---------- */\n    const ISO_TODAY = this.ISO_TODAY;\n    const ST_TINT = this.STATUS_TINT, ST_BD = this.STATUS_BD;\n    const vacToday = S.vacations.filter(v => v.start && v.start <= ISO_TODAY && (!v.end || v.end >= ISO_TODAY));\n    const statusList = S.drivers.map(n => Object.assign({ name: n }, this.effStatus(n, ISO_TODAY)));\n    const awayList = statusList.filter(x => x.status === 'On vacation' || x.status.indexOf('Transferred') === 0);\n    const transferredToday = awayList.filter(x => x.status.indexOf('Transferred') === 0);\n\n    const q = (S.lookupQuery || '').trim().toLowerCase();\n    const matchId = n => {\n      const i = this.idsFor(n);\n      return String(i.empId || '').toLowerCase() === q || String(i.civilId || '').toLowerCase() === q;\n    };\n    const lkName = q ? (S.drivers.find(matchId) || S.drivers.find(n => n.toLowerCase().indexOf(q) >= 0) || null) : null;\n    const rFrom = S.lookupFrom || '', rTo = S.lookupTo || '';\n    const inR = iso => (!iso) || ((!rFrom || iso >= rFrom)
