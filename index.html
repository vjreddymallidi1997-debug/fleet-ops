document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

" style-hover=\"border-color:#E5544B;color:#E5544B\">Sign out<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-width:0\">\n      <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:22px 26px 0;flex-wrap:wrap\">\n        <div>\n          <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:27px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1\">{{ deskTitle }}<\u002Fdiv>\n          <div style=\"color:#8296B4;font-size:13px;margin-top:3px\">{{ deskSub }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono';font-size:12px;color:#5C6E8A\">Period · Aug 2026 · Ahmadi Depot<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding:20px 26px 40px\">\n\n        <sc-if value=\"{{ showDaily }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px\">\n            <sc-for list=\"{{ dailySummary }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"flex:1;min-width:180px;background:#111B2C;border:1px solid {{ s.bd }};border-radius:11px;padding:14px 16px\">\n                <div style=\"color:#8296B4;font-size:11px;letter-spacing:.14em;text-transform:uppercase\">{{ s.label }}<\u002Fdiv>\n                <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:34px;color:{{ s.tint }};line-height:1.1\">{{ s.value }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <div style=\"flex:2;min-width:240px;background:#0E1729;border:1px solid #1E2C44;border-radius:11px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center\">\n              <div style=\"font-family:'JetBrains Mono';font-size:12px;color:#F2A33C;letter-spacing:.08em\">{{ dailyDate }}<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:13px\">{{ dailyMarked }} · tap a status to change it<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;overflow:hidden\">\n            <div style=\"overflow-x:auto\">\n              <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13.5px;min-width:900px\">\n                <sc-raw-thead><sc-raw-tr>\n                  <sc-for list=\"{{ dailyCols }}\" as=\"c\" hint-placeholder-count=\"6\">\n                    <sc-raw-th style=\"text-align:{{ c.align }};padding:9px 12px;border-bottom:1px solid #1E2C44;color:#8296B4;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;background:#0E1729\">{{ c.label }}<\u002Fsc-raw-th>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                <sc-raw-tbody>\n                  <sc-for list=\"{{ dailyRows }}\" as=\"r\" hint-placeholder-count=\"12\">\n                    <sc-raw-tr>\n                      <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #162236;font-family:'JetBrains Mono';font-weight:700\">{{ r.no }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #162236;font-family:'JetBrains Mono';color:#8296B4\">{{ r.plate }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono'\">{{ r.cap }}<\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #162236\">{{ r.driver }}<div style=\"color:#5C6E8A;font-size:11.5px\">{{ r.category }}<\u002Fdiv><\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:8px 12px;border-bottom:1px solid #162236\">\n                        <div style=\"display:flex;gap:6px\">\n                          <sc-for list=\"{{ r.toggles }}\" as=\"t\" hint-placeholder-count=\"2\">\n                            <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"cursor:pointer;border-radius:7px;padding:6px 11px;font-size:12.5px;background: e=\"flex:1;min-width:150px;background:#0E1729;border:1px solid #1E2C44;border-radius:10px;padding:11px 13px\">\n                  <div style=\"color:#8296B4;font-size:11px;letter-spacing:.12em;text-transform:uppercase\">{{ c.label }}<\u002Fdiv>\n                  <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:24px;color:#F2A33C;line-height:1.1\">{{ c.value }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:9px;flex-wrap:wrap;margin-top:14px\">\n              <button sc-camel-on-click=\"{{ doDownload }}\" style=\"cursor:pointer;flex:1;min-width:180px;min-height:46px;border-radius:9px;border:0;background:#F2A33C;color:#0B1220;font-size:15px;font-weight:700\">Save report file<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ doCopy }}\" style=\"cursor:pointer;flex:1;min-width:150px;min-height:46px;border-radius:9px;border:1px solid #22334F;background:transparent;color:#C7D6EA;font-size:14.5px;font-weight:600\">Copy code<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"color:#5C6E8A;font-size:12px;margin-top:8px\">Email or message the saved file to the admin, who imports it under Team Reports.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showTeamReports }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px\">\n            <sc-for list=\"{{ teamTotals }}\" as=\"t\" hint-placeholder-count=\"6\">\n              <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:14px 16px\">\n                <div style=\"color:#8296B4;font-size:11px;letter-spacing:.14em;text-transform:uppercase\">{{ t.label }}<\u002Fdiv>\n                <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:31px;color:{{ t.tint }};line-height:1.15;margin-top:4px\">{{ t.value }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px;max-width:760px\">\n            <div style=\"font-weight:600;font-size:15px\">Import a report<\u002Fdiv>\n            <div style=\"color:#8296B4;font-size:12.5px;margin-top:5px;line-height:1.5\">Each foreman, mechanic, safety supervisor and accountant taps <strong style=\"color:#C7D6EA\">Send<\u002Fstrong> on their own device. Drop the file they sent you here, or paste the code. Importing the same report twice never double-counts.<\u002Fdiv>\n\n            <div style=\"margin-top:14px\">\n              <div style=\"color:#8296B4;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px\">Report file<\u002Fdiv>\n              <input type=\"file\" accept=\".json,application/json\" sc-camel-on-change=\"{{ onImportFile }}\" style=\"width:100%;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#C7D6EA;padding:11px 12px;font-size:13.5px\">\n            <\u002Fdiv>\n\n            <div style=\"color:#8296B4;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:14px 0 6px\">Or paste the code<\u002Fdiv>\n            <textarea value=\"{{ importText }}\" sc-camel-on-change=\"{{ onImportText }}\" rows=\"5\" placeholder=\"Paste the code from the message here…\" style=\"width:100%;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:11px 12px;font-size:13px;font-family:'JetBrains Mono';line-height:1.55;resize:vertical\"><\u002Ftextarea>\n            <button sc-camel-on-click=\"{{ doImportText }}\" style=\"cursor:pointer;width:100%;min-height:46px;margin-top:11px;border-radius:9px;border:0;background:#F2A33C;color:#0B1220;font-size:15px;font-weight:700\">Import into dashboard<\u002Fbutton>\n\n            <sc-if value=\"{{ hasLastImport }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:13px;background:#0F241F;border:1px solid #1F5347;border-radius:10px;padding:11px 13px\">\n                <div style=\"color:#8296B4;font-size:11px;letter-spacing:.12em;text-transform:uppercase\">Last import<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#7BE3C6;margin-top:3px\">{{ lastImport }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ showLookup }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px;margin-bottom:14px\">\n            <div style=\"font-weight:600;font-size:15px\">Driver lookup — full history<\u002Fdiv>\n            <div style=\"color:#8296B4;font-size:12px;margin-bottom:12px\">Enter an Employee ID or Civil ID Number. Every record ever logged for that driver is kept — nothing is deleted at month end.<\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end\">\n              <div style=\"flex:1;min-width:260px\">\n                <div style=\"color:#8296B4;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px\">Employee ID / Civil ID<\u002Fdiv>\n                <input value=\"{{ lookupQuery }}\" sc-camel-on-change=\"{{ onLookupQuery }}\" placeholder=\"e.g. 30188 or 284091100123\" style=\"width:100%;min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 13px;font-size:15px;font-family:'JetBrains Mono'\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"color:#8296B4;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px\">From date<\u002Fdiv>\n                <input type=\"date\" value=\"{{ lookupFrom }}\" sc-camel-on-change=\"{{ onLookupFrom }}\" style=\"min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 11px;font-size:14px;font-family:'JetBrains Mono';colorScheme:dark\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"color:#8296B4;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px\">To date<\u002Fdiv>\n                <input type=\"date\" value=\"{{ lookupTo }}\" sc-camel-on-change=\"{{ onLookupTo }}\" style=\"min-height:44px;background:#0B1220;border:1px solid #22334F;border-radius:9px;color:#E6EDF7;padding:0 11px;font-size:14px;font-family:'JetBrains Mono';colorScheme:dark\">\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ clearLookupRange }}\" style=\"cursor:pointer;min-height:44px;padding:0 15px;border-radius:9px;border:1px solid #22334F;background:transparent;color:#8296B4;font-size:13.5px\">All time<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"color:#5C6E8A;font-size:12px;margin-top:8px;font-family:'JetBrains Mono'\">{{ lookupNote }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ lookupFound }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap\">\n              <div style=\"width:52px;height:52px;border-radius:50%;background:#1E2C44;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:700;font-size:20px\">{{ lk.initials }}<\u002Fdiv>\n              <div style=\"flex:1;min-width:220px\">\n                <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:26px;letter-spacing:.03em;text-transform:uppercase;line-height:1.1\">{{ lk.name }}<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:13px;font-family:'JetBrains Mono'\">{{ lk.ids }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:right\">\n                <div style=\"color:#8296B4;font-size:11px;letter-spacing:.14em;text-transform:uppercase\">Status today<\u002Fdiv>\n                <div style=\"font-size:16px;color:{{ lk.statusTint }}\">{{ lk.statusToday }}<\u002Fdiv>\n                <div style=\"color:#5C6E8A;font-size:12px\">{{ lk.statusDetail }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px\">\n              <sc-for list=\"{{ lkStats }}\" as=\"s\" hint-placeholder-count=\"5\">\n                <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:14px 16px\">\n                  <div style=\"color:#8296B4;font-size:11px;letter-spacing:.14em;text-transform:uppercase\">{{ s.label }}<\u002Fdiv>\n                  <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:31px;color:{{ s.tint }};line-height:1.15;margin-top:4px\">{{ s.value }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#5C6E8A;font-family:'JetBrains Mono'\">{{ s.note }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"background:#111B2C;border:1px solid #1E2C44;border-radius:11px;padding:16px 18px;margin-bottom:14px\">\n              <div style=\"font-weight:600;font-size:15px\">Salary paid — every entry logged by Accounts<\u002Fdiv>\n              <div style=\"color:#8296B4;font-size:12px\">{{ lkSalaryNote }}<\u002Fdiv>\n              <sc-if value=\"{{ lkSalaryEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"margin-top:12px;border:1px dashed #22334F;border-radius:10px;padding:20px;text-align:center;color:#8296B4;font-size:13px\">No salary entries posted for this driver yet.<\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ lkSalaryAny }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"overflow-x:auto\">\n                <sc-raw-table style=\"width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px;min-width:720px\">\n                  <sc-raw-thead><sc-raw-tr>\n                    <sc-for list=\"{{ lkSalaryCols }}\" as=\"c\" hint-placeholder-count=\"7\">\n                      <sc-raw-th style=\"text-align:{{ c.align }};padding:8px 10px;border-bottom:1px solid #1E2C44;color:#8296B4;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600\">{{ c.label }}<\u002Fsc-raw-th>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ lkSalaryRows }}\" as=\"r\" hint-placeholder-count=\"0\">\n                      <sc-raw-tr>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;font-family:'JetBrains Mono'\">{{ r.period }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;font-family:'JetBrains Mono';color:#8296B4\">{{ r.posted }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono'\">{{ r.stdH }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono';color:#F2A33C\">{{ r.otH }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono'\">{{ r.basic }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono';color:#F2A33C\">{{ r.otPay }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:9px 10px;border-bottom:1px solid #162236;text-align:right;font-family:'JetBrains Mono';font-weight:700\">{{ r.total }}<\u002Fsc-raw-td>\n                      <\u002Fsc-raw-tr>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-tbody>\n                <\u002Fsc-raw-table>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:12px\">\n                <sc-for list=\"{{ lkSalaryTotals }}\" as=\"t\" hint-placeholder-count=\"3\">\n                  <div style=\"flex:1;min-width:170px;background:#0E1729;border:1px solid #1E2C44;border-radius:10px;padding:11px 13px\">\n                    <div style=\"color:#8296B4;font-size:11px;letter-spacing:.12em;text-transform:uppercase\">{{ t.label }}<\u002Fdiv>\n                    <div style=\"font-family:'Barlow Condensed';font-weight:700;font-size:24px;color:{{ t.tint }};line-height:1.1\">{{ t.value }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-bottom:14px\">\n              <div style=\"background:#111B2C;border:1px solid #4A2320;border-radius:11px;padding:16px 18px\">\n                <div style=\"font-weight:600;font-size:15px\">Accidents involved in<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:12px\">{{ lkAccidentNote }}<\u002Fdiv>\n                <sc-if value=\"{{ lkAccidentsEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"margin-top:12px;border:1px dashed #22334F;border-radius:10px;padding:20px;text-align:center;color:#8296B4;font-size:13px\">No accidents on record for this driver.<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:12px\">\n                  <sc-for list=\"{{ lkAccidents }}\" as=\"a\" hint-placeholder-count=\"0\">\n                    <div style=\"background:#0E1729;border:1px solid {{ a.bd }};border-radius:10px;padding:11px 13px;display:flex;gap:11px\">\n                      <div style=\"width:5px;align-self:stretch;min-height:38px;border-radius:4px;background:{{ a.tint }};flex:none\"><\u002Fdiv>\n                      <div style=\"flex:1;min-width:0\">\n                        <div style=\"display:flex;justify-content:space-between;gap:10px\">\n                          <span style=\"font-family:'JetBrains Mono';font-size:12.5px;color:#8296B4\">{{ a.date }} · {{ a.ref }}<\u002Fspan>\n                          <span style=\"font-family:'JetBrains Mono';font-size:12.5px;color:{{ a.tint }}\">{{ a.fault }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"font-size:13.5px;margin-top:3px\">TNK {{ a.tanker }} · {{ a.desc }}<\u002Fdiv>\n                        <div style=\"font-family:'JetBrains Mono';font-size:12px;color:#5C6E8A\">repair {{ a.cost }} · deduction {{ a.deduction }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:#111B2C;border:1px solid #3E2A57;border-radius:11px;padding:16px 18px\">\n                <div style=\"font-weight:600;font-size:15px\">Vacations &amp; transfers<\u002Fdiv>\n                <div style=\"color:#8296B4;font-size:12px\">Complete record, oldest kept indefinitely<\u002Fdiv>\n                <sc-if value=\"{{ lkAwayEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"margin-top:12px;border:1px dashed #22334F;border-radius:10px;padding:20px;text-align:center;color:#8296B4;font-size:13px\">No vacation or transfer records for this driver.<\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"display:flex;flex-direction:column;gap:9px;margin-top:12px\">\n                  <sc-for list=\"{{ lkAway }}\" as=\"w\" hint-placeholder-count=\"0\">\n                    <div style=\"background:#0E1729;border:1px solid {{ w.bd }};border-radius:10px;padding:11px 13px;display:flex;gap:11px;align-items:center\">\n
