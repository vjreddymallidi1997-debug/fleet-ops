 {},\n      lookupQuery: '', lookupFrom: '', lookupTo: '',\n      vacQueryDate: '2026-08-16', vacForm: { driver: '', start: '', end: '', note: '' },\n      attSearch: '', attFilter: 'Unmarked', attGroupBy: false, attOpen: null,\n      newDrv: { name: '', empId: '', civilId: '', mobile: '' }, bulkText: '', drvSearch: '', confirmDrv: null,\n      importText: '', lastImport: '',\n      pendingRole: null, pinInput: '', pinConfirm: '', pinError: '', pinTries: 0, pinReset: false\n    }, d, this.loadSaved());\n  }\n\n  /* ---------- saving to this device ----------\n     Everything except transient UI state is written to localStorage, so a\n     refresh, a closed tab or a restarted phone no longer loses the day's work.\n     This is still per-device: it is not a substitute for a shared backend. */\n  get LS_KEY(){ return 'knpc-fleet-ops-v1'; }\n  get NO_SAVE(){\n    return ['toast','role','screen','adminTab','form','lookupQuery','lookupFrom','lookupTo',\n      'attSearch','attFilter','attGroupBy','attOpen','vacQueryDate','vacForm','jobIdx','swapIdx',\n      'tripFilter','rosterShift','shiftType','shiftOn','newDriver','currentDriver','fuelTanker','assignSaved',\n      'confirmClear','savedOnce','newDrv','bulkText','drvSearch','confirmDrv','importText',\n      'pendingRole','pinInput','pinConfirm','pinError','pinTries','pinReset'];\n  }\n  loadSaved(){\n    try {\n      const raw = window.localStorage.getItem(this.LS_KEY);\n      if (!raw) return null;\n      const p = JSON.parse(raw);\n      if (!p || p.v !== 1 || !p.d) return null;\n      const deny = this.NO_SAVE, out = {};\n      Object.keys(p.d).forEach(k => { if (deny.indexOf(k) < 0) out[k] = p.d[k]; });\n      return out;\n    } catch (e) { return null; }\n  }\n  componentDidUpdate(){\n    clearTimeout(this._saveT);\n    this._saveT = setTimeout(() => {\n      try {\n        const out = {}, deny = this.NO_SAVE;\n        Object.keys(this.state).forEach(k => { if (deny.indexOf(k) < 0) out[k] = this.state[k]; });\n        window.localStorage.setItem(this.LS_KEY, JSON.stringify({ v: 1, at: Date.now(), d: out }));\n        if (!this.state.savedOnce) this.setState({ savedOnce: true });\n      } catch (e) { /* private mode / quota — app still works, just unsaved */ }\n    }, 400);\n  }\n  /* ================= SECURITY =================\n     This app is a static page with no server, so most of a standard web VAPT\n     checklist has no surface here: no SQL, no ORM, no templating engine, no\n     shell, no XML parser, no server-side fetch, no cookies, no CSRF-able\n     endpoint, no JWT, no GraphQL, no WebSocket, no upstream cache.\n     What IS attackable is the untrusted data path — the team report that a\n     foreman or accountant sends in and Admin imports — plus role access and\n     the payroll data sitting in this browser. Those are handled below. */\n\n  /* Keys that let an attacker reach Object.prototype. Any of these arriving in\n     an imported report is an attack, not a typo — refuse the whole file. */\n  get UNSAFE_KEYS(){ return ['__proto__', 'constructor', 'prototype']; }\n\n  /* JSON.parse's reviver runs bottom-up on every key, so dropping the unsafe\n     ones here stops prototype pollution before the object ever exists. */\n  safeParse(txt){\n    const bad = this.UNSAFE_KEYS;\n    let hit = false;\n    const out = JSON.parse(txt, function (k, v) {\n      if (bad.indexOf(k) >= 0) { hit = true; return undefined; }\n      return v;\n    });\n    return { data: out, tampered: hit };\n  }\n\n  /* Every string that comes from a person or a file passes through here before\n     it is stored or displayed: control characters stripped, length capped.\n     React escapes markup on render, so this is about storage hygiene and\n     stopping a 5 MB \"name\" from wedging the roster. */\n  clean(v, max){\n    if (v === null || v === undefined) return '';\n    return String(v)\n      .replace(/[\\u0000-\\u001F\\u007F-\\u009F\\u200B-\\u200F\\u2028\\u2029\\uFEFF]/g, '')\n      .slice(0, max || 120)\n      .trim();\n  }\n  cleanId(v, max){ return String(v === null || v === undefined ? '' : v).replace(/[^0-9A-Za-z-]/g, '').slice(0, max || 24); }\n  cleanNum(v, max){\n    const n = parseFloat(String(v).replace(/[^0-9.\\-]/g, ''));\n    if (!isFinite(n) || n < 0) return 0;\n    return Math.min(n, max === undefined ? 1e7 : max);\n  }\n\n  /* Bounds on an imported report. A report that busts these is either corrupt\n     or hostile; either way it does not get merged. */\n  get IMPORT_LIMITS(){ return { bytes: 8 * 1024 * 1024, rowsPerTable: 200000, tables: 40, strLen: 300 }; }\n\n  /* Recursively re-build an imported value, keeping only plain data. Functions,\n     nested prototypes and absurd depth cannot survive this. */\n  scrubValue(v, depth){\n    const d = depth || 0;\n    if (d > 6) return null;\n    if (v === null) return null;\n    const t = typeof v;\n    if (t === 'string') return this.clean(v, this.IMPORT_LIMITS.strLen);\n    if (t === 'number') return isFinite(v) ? v : 0;\n    if (t === 'boolean') return v;\n    if (Array.isArray(v)) return v.slice(0, this.IMPORT_LIMITS.rowsPerTable).map(x => this.scrubValue(x, d + 1));\n    if (t === 'object') {\n      const out = {};\n      Object.keys(v).slice(0, 200).forEach(k => {\n        if (this.UNSAFE_KEYS.indexOf(k) >= 0) return;\n        out[this.clean(k, 80)] = this.scrubValue(v[k], d + 1);\n      });\n      return out;\n    }\n    return null;\n  }\n\n  /* ---------- role access ----------\n     The role picker decides who sees payroll, so it needs a gate. There is no\n     server to check against, so this is a local PIN: it stops a driver picking\n     Admin on a shared phone. It is NOT protection against someone who controls\n     the device — say so plainly in the UI rather than implying otherwise. */\n  get GATED_ROLES(){ return ['admin', 'accounts']; }\n  get PIN_STORE(){ return 'knpc-fleet-pins-v1'; }\n  loadPins(){\n    try { return JSON.parse(window.localStorage.getItem(this.PIN_STORE) || '{}') || {}; } catch (e) { return {}; }\n  }\n  /* Not a password hash — a static page cannot hold a secret. It only keeps the\n     PIN from sitting in storage in the clear where a glance would read it. */\n  hashPin(role, pin){\n    const s = role + '|' + pin + '|rehal-fleet';\n    let h1 = 0x811c9dc5, h2 = 0x1000193;\n    for (let i = 0; i < s.length; i++) {\n      h1 = ((h1 ^ s.charCodeAt(i)) * 0x01000193) >>> 0;\n      h2 = ((h2 + s.charCodeAt(i) * (i + 7)) * 0x85ebca6b) >>> 0;\n    }\n    return h1.toString(36) + '-' + h2.toString(36);\n  }\n  savePin(role, pin){\n    try {\n      const p = this.loadPins();\n      p[role] = this.hashPin(role, pin);\n      window.localStorage.setItem(this.PIN_STORE, JSON.stringify(p));\n      return true;\n    } catch (e) { return false; }\n  }\n  pinSetFor(role){ return !!this.loadPins()[role]; }\n  checkPin(role, pin){ return this.loadPins()[role] === this.hashPin(role, pin); }\n  /* A forgotten PIN needs a way out. There is no server to verify identity\n     against, and the PIN only guards against casual role-switching on a shared\n     device — anyone holding the unlocked device could read the records anyway.\n     So a local reset is consistent with what the PIN actually claims to do;\n     pretending otherwise would just lock the admin out of his own records. */\n  clearPin(role){\n    try {\n      const p = this.loadPins();\n      delete p[role];\n      window.localStorage.setItem(this.PIN_STORE, JSON.stringify(p));\n      return true;\n    } catch (e) { return false; }\n  }\n\n  /* ---------- idle lock ----------\n     Payroll for 90 people should not stay on screen on an unattended laptop. */\n  get IDLE_MS(){ return 15 * 60 * 1000; }\n  touchActivity(){\n    this._lastActive = Date.now();\n  }\n  startIdleWatch(){\n    this.touchActivity();\n    ['click', 'keydown', 'touchstart', 'mousemove'].forEach(ev =>\n      window.addEventListener(ev, this._touch = () => this.touchActivity(), { passive: true }));\n    this._idleT = setInterval(() => {\n      if (!this.state.role) return;\n      if (this.GATED_ROLES.indexOf(this.state.role) < 0) return;\n      if (Date.now() - (this._lastActive || 0) > this.IDLE_MS) {\n        this.setState({ role: null, screen: 'home', pinInput: '', toast: 'Signed out after 15 minutes idle.' });\n      }\n    }, 30000);\n  }\n  componentWillUnmount(){\n    clearInterval(this._idleT);\n    clearTimeout(this._saveT);\n    ['click', 'keydown', 'touchstart', 'mousemove'].forEach(ev => window.removeEventListener(ev, this._touch));\n  }\n  componentDidMount(){\n    this.startIdleWatch();\n    /* Clickjacking is handled by the X-Frame-Options / CSP header, which only\n       the host can send — Admin → Security tells the admin to set it in Render.\n       There is deliberately no JS frame-busting here: an attacker can sandbox\n       an iframe to defeat both a redirect and a warning, so it adds no real\n       protection, while every legitimate embed (any preview) trips it. */\n  }\n\n  /* ---------- sending a day's work to Admin ----------\n     No server: each role exports the records entered on their own device, and\n     Admin merges them in. Merging is idempotent — importing the same file twice\n     never double-counts, so a foreman can safely re-send if unsure. */\n  /* A role may only ever send what that role can itself enter. Exporting the\n     whole state would put every driver's pay in a plain-text file on a foreman's\n     phone, which the role gating exists to prevent. */\n  get SHARE_KEYS(){\n    return {\n      driver:   ['dutyLog','trips'],\n      foreman:  ['attendance','roster','usage','pending','vacations'],\n      workshop: ['repairs','pending'],\n      safety:   ['accidents','deductions'],\n      accounts: ['salaryLedger','deductions'],\n      admin:    ['dutyLog','trips','attendance','roster','usage','pending','vacations','repairs','accidents','deductions','salaryLedger','drivers','driverIds']\n    }[this.state.role] || [];\n  }\n  get SHARE_LABELS(){\n    return { dutyLog: 'Duty logs', trips: 'Trips', attendance: 'Attendance marks', roster: 'Shift assignments',\n      usage: 'Tanker usage', pending: 'Breakdown reports', vacations: 'Vacation records', repairs: 'Repair jobs',\n      accidents: 'Accident reports', deductions: 'Deductions', salaryLedger: 'Salary entries', drivers: 'Drivers' };\n  }\n  /* Drivers only ever send their own rows, never the whole roster's. */\n  shareRows(k){\n    const S = this.state;\n    const me = (S.profile || {}).name || S.currentDriver || '';\n    const v = S[k];\n    if (k === 'attendance') return Object.assign({}, v);\n    if (!Array.isArray(v)) return v;\n    if (S.role === 'driver' && (k === 'dutyLog' || k === 'trips')) return v.filter(r => r.driver === me);\n    return v.slice();\n  }\n  exportPayload(){\n    const S = this.state, out = {};\n    this.SHARE_KEYS.forEach(k => { if (S[k] !== undefined) out[k] = this.shareRows(k); });\n    if (S.role === 'driver' && (S.profile || {}).name) {\n      out.drivers = [S.profile.name];\n      out.driverIds = { [S.profile.name]: { empId: S.profile.empId || '', civilId: S.profile.civilId || '', mobile: S.profile.mobile || '' } };\n    }\n    return { app: 'knpc-fleet-ops', v: 1, role: S.role, by: (S.profile || {}).name || (S.staff || {}).name || '', at: new Date().toISOString(), d: out };\n  }\n  exportText(){ return JSON.stringify(this.exportPayload()); }\n  shareCounts(){\n    const L = this.SHARE_LABELS;\n    return this.SHARE_KEYS.map(k => {\n      const r = this.shareRows(k);\n      const n = Array.isArray(r) ? r.length : Object.keys(r || {}).length;\n      return [L[k] || k, n];\n    }).filter(r => r[1] > 0);\n  }\n  downloadReport(){\n    try {\n      const S = this.state;\n      const who = ((S.profile || {}).name || (S.staff || {}).name || S.role || 'report').replace(/[^a-z0-9]+/gi, '-').toLowerCase();\n      const name = 'fleet-' + who + '-' + new Date().toISOString().slice(0, 10) + '.json';\n      const blob = new Blob([this.exportText()], { type: 'application/json' });\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url; a.download = name;\n      document.body.appendChild(a); a.click(); a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 4000);\n      this.setState({ toast: 'Saved ' + name + ' — send that file to the admin' });\n    } catch (e) { this.setState({ toast: 'Could not save the file on this device.' }); }\n  }\n  shareReport(){\n    const txt = this.exportText();\n    try {\n      const S = this.state;\n      const who = ((S.profile || {}).name || (S.staff || {}).name || S.role || 'report').replace(/[^a-z0-9]+/gi, '-').toLowerCase();\n      const file = new File([txt], 'fleet-' + who + '-' + new Date().toISOString().slice(0, 10) + '.json', { type: 'application/json' });\n      if (navigator.canShare && navigator.canShare({ files: [file] })) {\n        navigator.share({ files: [file], title: 'Fleet Ops report' })\n          .then(() => this.setState({ toast: 'Sent to the admin' }))\n          .catch(() => {});\n        return;\n      }\n    } catch (e) { /* fall through */ }\n    this.downloadReport();\n  }\n  copyReport(){\n    const txt = this.exportText();\n    const done = () => this.setState({ toast: 'Code copied — paste it in a message to the admin' });\n    try {\n      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(done, () => this.downloadReport()); return; }\n    } catch (e) { /* fall through */ }\n    this.downloadReport();\n  }\n  mergePayload(raw){\n    /* An imported report is the one piece of untrusted input this app takes.\n       Everything below treats it as hostile until it has been parsed safely,\n       validated against a schema, scrubbed, and clamped to what the sending\n       role is actually allowed to write. */\n\n    /* Only Admin merges reports. Without this, any role could import a report\n       claiming role:\"accounts\" and write the payroll ledger. */\n    if (this.state.role !== 'admin') { this.setState({ toast: 'Only the admin can import team reports.' }); return; }\n\n    if (typeof raw === 'string' && raw.length > this.IMPORT_LIMITS.bytes) {\n      this.setState({ toast: 'That report is too large to be genuine — refused.' }); return;\n    }\n\n    let p, tampered = false;\n    try {\n      if (typeof raw === 'string') { const r = this.safeParse(raw); p = r.data; tampered = r.tampered; }\n      else p = raw;\n    } catch (e) { this.setState({ toast: 'That is not a Fleet Ops report — it could not be read.' }); return; }\n\n    if (tampered) {\n      this.setState({ toast: 'Refused: that file contains keys that could tamper with the app. Ask them to send it again.' });\n      return;\n    }\n    if (!p || typeof p !== 'object' || Array.isArray(p) || p.app !== 'knpc-fleet-ops' || p.v !== 1 || !p.d || typeof p.d !== 'object') {\n      this.setState({ toast: 'That does not look like a Fleet Ops report.' }); return;\n    }\n\n    /* A report may only carry the tables its own role is allowed to enter.\n       A foreman's file claiming salary entries is dropped, not merged. */\n    const ALLOWED = {\n      driver:   ['dutyLog', 'trips', 'drivers', 'driverIds'],\n      foreman:  ['attendance', 'roster', 'usage', 'pending', 'vacations', 'drivers', 'driverIds'],\n      workshop: ['repairs', 'pending'],\n      safety:   ['accidents', 'deductions'],\n      accounts: ['salaryLedger', 'deductions'],\n      admin:    ['dutyLog', 'trips', 'attendance', 'roster', 'usage', 'pending', 'vacations', 'repairs', 'accidents', 'deductions', 'salaryLedger', 'drivers', 'driverIds']\n    };\n    const senderRole = typeof p.role === 'string' ? p.role : '';\n    const allow = ALLOWED[senderRole];\n    if (!allow) { this.setState({ toast: 'That report does not say which role sent it — refused.' }); return; }\n\n    const rawD = p.d, dropped = [];\n    const d = {};\n    Object.keys(rawD).slice(0, this.IMPORT_LIMITS.tables).forEach(k => {\n      if (this.UNSAFE_KEYS.indexOf(k) >= 0) return;\n      if (allow.indexOf(k) < 0) { dropped.push(k); return; }\n      d[k] = this.scrubValue(rawD[k], 0);\n    });\n    if (!Object.keys(d).length) {\n      this.setState({ toast: 'Nothing in that report belongs to the ' + senderRole + ' role.' }); return;\n    }\n    const added = [];\n    const keyOf = {\n      dutyLog: r => r.date + '|' + r.driver,\n      trips: r => r.id || (r.iso + '|' + r.tanker + '|' + r.qty),\n      accidents: r => r.ref,\n      deductions: r => (r.ref || '') + '|' + r.driver + '|' + r.amount,\n      salaryLedger: r => r.driver + '|' + r.period,\n      vacations: r => r.driver + '|' + r.start,\n      repairs: r => (r.ref || '') + '|' + r.tanker + '|' + (r.problem || ''),\n      pending: r => r.tanker + '|' + (r.problem || '') + '|' + (r.time || ''),\n      usage: r => r.tanker + '|' + (r.shift || '') + '|' + (r.start || '')\n    };\n    this.setState(st => {\n      const next = {};\n      Object.keys(keyOf).forEach(k => {\n        if (!Array.isArray(d[k])) return;\n        const mine = Array.isArray(st[k]) ? st[k].slice() : [];\n        const seen = {};\n        mine.forEach(r => { seen[keyOf[k](r)] = true; });\n        let n = 0;\n        d[k].forEach(r => { const id = keyOf[k](r); if (!seen[id]) { seen[id] = true; mine.push(r); n++; } });\n        if (n) { next[k] = mine; added.push(n + ' ' + k.replace(/([A-Z])/g, ' $1').toLowerCase()); }\n      });\n      /* roster is one row per tanker, so a changed assignment must REPLACE the\n         existing row — appending would silently drop the foreman's reassignment */\n      if (Array.isArray(d.roster)) {\n        const mine = (st.roster || []).slice();\n        let n = 0;\n        d.roster.forEach(r => {\n          const at = mine.findIndex(x => x.tanker === r.tanker);\n          if (at < 0) { mine.push(r); n++; return; }\n          const cur = mine[at];\n          if (cur.dayDriver !== r.dayDriver || cur.nightDriver !== r.nightDriver || cur.running !== r.running) {\n            mine[at] = Object.assign({}, cur, r); n++;\n          }\n        });\n        if (n) { next.roster = mine; added.push(n + ' shift assignments'); }\n      }\n      if (d.attendance && typeof d.attendance === 'object' && !Array.isArray(d.attendance)) {\n        const att = Object.assign({}, st.attendance);\n        const OK = this.AWAY_STATUSES;\n        let n = 0;\n        Object.keys(d.attendance).forEach(k => {\n          if (this.UNSAFE_KEYS.indexOf(k) >= 0) return;\n          if (!Object.prototype.hasOwnProperty.call(att, k)) {\n            const v = d.attendance[k];\n            if (!v || typeof v !== 'object') return;\n            /* only a status this app actually defines gets stored */\n            if (OK.indexOf(v.status) < 0) return;\n            att[k] = { status: v.status, project: this.clean(v.project, 80) };\n            n++;\n          }\n        });\n        if (n) { next.attendance = att; added.push(n + ' attendance marks'); }\n      }\n      /* a roster or duty row may name a driver this device has never seen —\n         add the name so the assignment is not left dangling */\n      const implied = [];\n      (next.roster || []).forEach(r => { [r.dayDriver, r.nightDriver].forEach(n2 => { if (n2 && implied.indexOf(n2) < 0) implied.push(n2); }); });\n      (d.dutyLog || []).forEach(r => { if (r.driver && implied.indexOf(r.driver) < 0) implied.push(r.driver); });\n      if (implied.length || Array.isArray(d.drivers)) {\n        const ds = st.drivers.slice(), ids = Object.assign({}, st.driverIds);\n        let n = 0;\n        implied.concat(d.drivers || []).forEach(nm => { if (ds.indexOf(nm) < 0) { ds.push(nm); n++; } });\n        Object.keys(d.driverIds || {}).forEach(nm => {\n          if (this.UNSAFE_KEYS.indexOf(nm) >= 0) return;\n          if (Object.prototype.hasOwnProperty.call(ids, nm)) return;\n          const v = d.driverIds[nm] || {};\n          ids[nm] = { empId: me ? { empId: P.empId, civilId: P.civilId, mobile: P.mobile } : null);\n  }\n  attRec(name, iso){\n    const r = (this.state.attendance || {})[name + '|' + (iso || this.ISO_TODAY)];\n    if (r && typeof r === 'object') return r;\n    if (typeof r === 'string' && r) return { status: r, project: '' };\n    return null;\n  }\n  vacationOn(name, iso){\n    return (this.state.vacations || []).find(v => v.driver === name && v.start && v.start <= iso && (!v.end || v.end >= iso)) || null;\n  }\n  effStatus(name, iso){\n    const day = iso || this.ISO_TODAY;\n    const r = this.attRec(name, day);\n    if (r && r.status) return { status: r.status, project: r.project || '' };\n    const v = this.vacationOn(name, day);\n    if (v) return { status: 'On vacation', project: (v.note || 'Vacation') + ' · back ' + (v.end ? this.fmtD(v.end) : 'date not known') };\n    const logged = (this.state.dutyLog || []).some(l => l.driver === name && l.date === this.TODAY);\n    return { status: logged ? 'Present' : 'Absent', project: '' };\n  }\n  setAtt(name, status){\n    const key = name + '|' + this.ISO_TODAY;\n    this.setState(st => ({\n      attendance: Object.assign({}, st.attendance, {\n        [key]: { status, project: status.indexOf('Transferred') === 0 ? ((st.attendance[key] || {}).project || '') : '' }\n      }),\n      toast: name + ' → ' + status\n    }));\n  }\n  setAttProject(name, project){\n    const key = name + '|' + this.ISO_TODAY;\n    this.setState(st => ({\n      attendance: Object.assign({}, st.attendance, {\n        [key]: Object.assign({ status: 'Transferred to other project' }, st.attendance[key], { project })\n      })\n    }));\n  }\n  donut(items){\n    const total = items.reduce((a, b) => a + b.v, 0) || 1, C = 2 * Math.PI * 54;\n    let acc = 0;\n    return items.map(it => {\n      const f = it.v / total, seg = f * C;\n      const o = Object.assign({}, it, {\n        dash: (Math.max(seg - 2, 0)).toFixed(1) + ' ' + (C - Math.max(seg - 2, 0)).toFixed(1),\n        offset: (-acc * C).toFixed(1),\n        pctLabel: Math.round(f * 100) + '%'\n      });\n      acc += f; return o;\n    });\n  }\n  line(vals, pad){\n    const mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals), sp = (mx - mn) || 1;\n    return vals.map((v, i) => {\n      const x = 10 + i * (580 / (vals.length - 1));\n      const y = 172 - ((v - mn) / sp) * (150 - (pad || 0));\n      return { x: x.toFixed(1), y: y.toFixed(1) };\n    });\n  }\n\n  /* ---------- render values ---------- */\n  renderVals(){\n    const S = this.state, R = S.role;\n    const TODAY = this.TODAY, TODAY_LONG = this.TODAY_LONG, MONTH_DAYS = this.MONTH_DAYS;\n    const roles = [\n      { key: 'admin', name: 'Admin / Dispatcher', abbr: 'AD', desc: 'Full operations dashboard, trips, fleet, costs', platform: 'Web · desktop', tint: '#F2A33C' },\n      { key: 'driver', name: 'Driver', abbr: 'DR', desc: 'Log trips, shift clock, report breakdowns', platform: 'Mobile', tint: '#35C2A5' },\n      { key: 'foreman', name: 'Foreman', abbr: 'FM', desc: 'Triage driver faults, dispatch to workshop', platform: 'Mobile', tint: '#4C8DF6' },\n      { key: 'workshop', name: 'Workshop / Mechanic', abbr: 'WS', desc: 'Repair jobs, parts and cost logging', platform: 'Mobile', tint: '#C08BF0' },\n      { key: 'safety', name: 'Safety Supervisor', abbr: 'SF', desc: 'Accident reports, fault type, deductions', platform: 'Mobile', tint: '#E5544B' },\n      { key: 'accounts', name: 'Accounts', abbr: 'AC', desc: 'Payroll, deductions, billing by rate slab', platform: 'Web · desktop', tint: '#7BE3C6' }\n    ];\n    const roleMeta = {};\n    roles.forEach(r => roleMeta[r.key] = r);\n    const isDesk = R === 'admin' || R === 'accounts';\n    const isMobile = !!R && !isDesk;\n\n    /* aggregates */\n    const trips = S.trips;\n    const byProduct = S.products.map((p, i) => ({\n      label: p, v: trips.filter(t => t.product === p).length,\n      color: ['#F2A33C','#4C8DF6','#35C2A5','#C08BF0','#E5544B'][i]\n    }));\n ault', 'Company fault', 'Third-party fault'].map(k => Object.assign({\n        label: k, note: k === 'Driver fault' ? 'auto deduction' : k === 'Company fault' ? 'absorbed' : 'recover from insurer',\n        onClick: () => this.set('fault', k)\n      }, chip(f.fault === k, k === 'Driver fault' ? '#E5544B' : k === 'Company fault' ? '#F2A33C' : '#4C8DF6'))),\n      deductNote: f.fault === 'Driver fault'\n        ? 'Driver fault → a salary deduction of 35% of repair cost (' + this.kd(Math.round((parseFloat(f.cost) || 0) * 0.35 * 10) / 10) + ') will be created for ' + f.driver + '.'\n        : 'No salary deduction is created for ' + f.fault.toLowerCase() + '.',\n      deductNoteBg: f.fault === 'Driver fault' ? '#1C1416' : '#0E1729',\n      deductNoteBd: f.fault === 'Driver fault' ? '#4A2320' : '#1E2C44',\n      deductNoteFg: f.fault === 'Driver fault' ? '#FF9A92' : '#8296B4',\n      submitAccident: () => {\n        const cost = parseFloat(f.cost) || 0;\n        const ref = 'ACC-00' + (32 + this.state.accidents.length - 5);\n        if (f.fault === 'Driver fault' && !faultDriver) {\n          this.flash('Enter a valid Employee ID or Civil ID so the accident links to the driver’s record.');\n          return;\n        }\n        const linkedIds = faultDriver ? this.idsFor(faultDriver) : {};\n        const a = { tanker: f.tanker, driver: faultDriver || f.driver, empId: linkedIds.empId || '', civilId: linkedIds.civilId || '',\n          iso: ISO_TODAY, fault: f.fault, desc: f.desc || 'Reported by ' + (meStaffName || 'HSE'), cost, ref };\n        this.setState(st => ({\n          accidents: [a].concat(st.accidents),\n          deductions: f.fault === 'Driver fault'\n            ? [{ driver: a.driver, tanker: f.tanker, ref, desc: a.desc, repair: cost, amount: Math.round(cost * 0.35 * 10) / 10 }].concat(st.deductions)\n            : st.deductions,\n          repairs: [{ tanker: f.tanker, problem: 'Accident damage', parts: 'Assessment pending', category: 'Accident', cost, status: 'Awaiting parts', month: 7 }].concat(st.repairs)\n        }));\n        this.flash(f.fault === 'Driver fault'\n          ? ref + ' filed · linked to ' + a.driver + '’s record · deduction ' + this.kd(Math.round(cost * 0.35 * 10) / 10) + ' raised'\n          : ref + ' filed · no driver deduction');\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
